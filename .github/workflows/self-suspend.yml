name: Verify self-suspend identity and execution

on:
  workflow_dispatch:
  push:
    paths:
      - 'build/ntdll-unix/thread_ios.c'
      - 'build/ntdll-unix/self_suspend*.h'
      - 'build/wineserver/mach_ios.c'
      - 'build/wineserver/build.sh'
      - 'build/wineserver/stage-self-suspend.py'
      - 'tests/host/check-self-suspend-*.py'
      - 'tools/check-self-suspend-package.py'
      - '.github/workflows/self-suspend.yml'
  pull_request:
    paths:
      - 'build/ntdll-unix/thread_ios.c'
      - 'build/ntdll-unix/self_suspend*.h'
      - 'build/wineserver/mach_ios.c'
      - 'build/wineserver/build.sh'
      - 'build/wineserver/stage-self-suspend.py'
      - 'tests/host/check-self-suspend-*.py'
      - 'tools/check-self-suspend-package.py'
      - '.github/workflows/self-suspend.yml'

permissions:
  contents: read

jobs:
  actual-suspend-paths:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 wine
      - name: Exercise real suspend and resume paths with cooperating threads
        env:
          CC: clang
        run: |
          python3 tests/host/check-self-suspend-protocol.py
          python3 tests/host/check-self-suspend-resume.py
          python3 tests/host/check-self-suspend-trace.py
          python3 tests/host/check-self-suspend-package.py
          python3 tests/host/check-service-async-apc.py
          python3 tests/host/check-wow-context.py
          python3 tests/host/check-suspend-windows.py
