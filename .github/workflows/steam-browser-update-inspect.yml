name: Inspect genuine Steam browser update
on:
  workflow_dispatch:
  push:
    branches: ['codex/inspect-*']
    paths:
      - tools/inspect-steam-browser-update.py
      - .github/workflows/steam-browser-update-inspect.yml
permissions:
  contents: read
jobs:
  public-component-inspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read verified official archives without installing or executing components
        run: python3 tools/inspect-steam-browser-update.py --output inspection/steam-browser-update.json
      - uses: actions/upload-artifact@v4
        with:
          name: steam-browser-update-inspection
          path: inspection/steam-browser-update.json
          if-no-files-found: error
          retention-days: 3
