name: Real Windows mapped-filename contract reference
on:
  push:
    branches: [codex/windows-mapped-oracle-20261111]
permissions:
  contents: read
jobs:
  windows-reference:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute actual Windows mapped-file API
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c11 /O2 /W4 tests\integration\authenticode\mapped-filename-reference.c /Fe:mapped-filename-reference.exe psapi.lib
          if errorlevel 1 exit /b %errorlevel%
          mapped-filename-reference.exe
