name: Review Run14 pressure attribution without fault experiments
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  normal-inputs:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Fetch matching headers without executing vendor binaries
        run: git submodule update --init --depth 1 dxmt
      - name: Normal metadata and measured-budget inputs only
        run: |
          python3 tests/host/check-pressure-boundary-observation.py ${{ runner.os == 'macOS' && '--require-swift' || '' }}
          python3 tests/host/check-dxmt-resource-budget.py --run14-normal-only
          python3 tests/host/check-stuck-store-scheduling.py --discovery-normal-only
          python3 tests/host/check-ci-component-keys.py
  tested-native:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Madeira-ipa
          run-id: 44815121124
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/run14-tested
      - name: Read tested provenance and actual native continuation symbols
        run: |
          python3 tools/check-store-recovery-package.py --ipa "$RUNNER_TEMP/run14-tested/Madeira.ipa" --revision 08c333bae081862256d73d0d4b388ceea9fa1db7
          python3 tools/inspect-run14-native.py --ipa "$RUNNER_TEMP/run14-tested/Madeira.ipa"
