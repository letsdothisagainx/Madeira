name: Research native Windows registry security-size contract
on:
  workflow_dispatch:
  push:
    branches: ['codex/inspect-*']
    paths:
      - tests/integration/regquery-security-contract.c
      - tools/run-native-regquery-contract.py
      - .github/workflows/regquery-security-contract.yml
permissions:
  contents: read
jobs:
  native-reference:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Observe real RegQueryInfoKey A/W and NtQuerySecurityObject behavior
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.architecture }}
          if errorlevel 1 exit /b %errorlevel%
          python tools\run-native-regquery-contract.py --output regquery-reference-${{ matrix.architecture }}
          if errorlevel 1 exit /b %errorlevel%
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regquery-native-reference-${{ matrix.architecture }}
          path: regquery-reference-${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 3
