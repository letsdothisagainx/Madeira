name: Verify CS2 diagnostic input preservation
on:
  push:
    branches: [codex/validate-cs2-vac-input-8bd]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-input:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load pinned Wine input headers
        run: git submodule update --init --depth 1 wine
      - name: Execute existing production input regressions
        run: |
          set -o pipefail
          {
            python3 tests/host/check-hardware-input.py || exit "$?"
            python3 tests/host/check-pointer-geometry.py || exit "$?"
            python3 tests/host/check-pointer-capture.py || exit "$?"
            python3 tests/host/check-clipboard-paste.py || exit "$?"
            python3 tests/host/check-control-presets.py || exit "$?"
            python3 tests/host/check-pad-output.py || exit "$?"
          } | tee input-preservation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cs2-input-preservation
          path: input-preservation.txt
          if-no-files-found: error
          retention-days: 14
