name: Inspect exact HTML boundary functions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-htmlipc:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect only missing exact HTML boundary functions
        run: |
          python3 -m venv "$RUNNER_TEMP/htmlipc-tools"
          "$RUNNER_TEMP/htmlipc-tools/bin/pip" install pefile==2024.8.26 capstone==5.0.6
          "$RUNNER_TEMP/htmlipc-tools/bin/python" tools/inspect-controller-fast.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-controller-boundary-report
          path: controller-fast-report.json
          retention-days: 3
