name: Check official Win32 beta browser manifest only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare known official Win32 manifests without downloading archives
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,re,json,hashlib
          def nodes(text):
           tokens=[a if a else b for a,b in re.findall(r'"([^"\\r\\n]*)"|([{}])',text)];pos=0
           def parse():
            nonlocal pos
            d={}
            while pos<len(tokens):
             key=tokens[pos];pos+=1
             if key=='}':return d
             value=tokens[pos];pos+=1;d[key]=parse() if value=='{' else value
            return d
           def walk(d,path=()):
            if not isinstance(d,dict):return
            if path and path[-1] in ['bins_cef_win32','bins_webhelpers_win32']:yield path,{k:v for k,v in d.items() if k in ['file','sha2','size']}
            for k,v in d.items():yield from walk(v,path+(k,))
           return list(walk(parse()))
          results={}
          for name in ['steam_client_win32','steam_client_publicbeta_win32']:
           url='https://client-update.akamai.steamstatic.com/'+name
           try:
            with urllib.request.urlopen(url,timeout=30) as response:data=response.read(262145);status=response.status
            assert len(data)<=262144
            text=data.decode();versions=re.findall(r'"version"\\s*"([0-9]+)"',text)
            result={'url':url,'http_status':status,'sha256':hashlib.sha256(data).hexdigest(),'versions':versions,'browser_packages':nodes(text)}
           except urllib.error.HTTPError as error:result={'url':url,'http_status':error.code}
           results[name]=result;print('OFFICIAL_MANIFEST',name,json.dumps(result,sort_keys=True),flush=True)
          stable=results['steam_client_win32'];beta=results['steam_client_publicbeta_win32']
          comparison={'beta_available':beta.get('http_status')==200,'same_manifest_bytes':stable.get('sha256')==beta.get('sha256') if beta.get('http_status')==200 else None,'same_browser_packages':stable.get('browser_packages')==beta.get('browser_packages') if beta.get('http_status')==200 else None,'archive_downloads':0,'runtime_or_config_changes':0}
          print('RESULT',json.dumps(comparison,sort_keys=True),flush=True)
          PY
