name: Inspect baseline bridge atomic replacement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: xcode-27
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reproduce exact baseline production bridge upgrade with different sizes
        run: python3 tools/bridge-baseline/probe.py
