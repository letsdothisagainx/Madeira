name: Real official browser cache verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-cache:
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      MADEIRA_VALVE_ARCHIVE_CACHE: ${{ github.workspace }}/.valve-package-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .valve-package-cache
          key: valve-htmlipc-pin-${{ github.run_id }}
          restore-keys: valve-htmlipc-v1-1792618285-1769731672-
      - name: Exercise actual official archives with production Swift parser and URLSession
        run: python3 work/browser-cache/check-official-browser-cache.py
