name: Compare coherent official Steam browser architectures
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: python3 -m pip install pefile==2024.8.26 unicorn==2.1.4
      - name: Inspect official coherent browser packages without starting Steam
        run: |
          python3 - <<'PYINSPECT'
          """Read-only identity/ABI inspection of official archives; never execute DllMain."""
          from pathlib import Path
          import base64,hashlib,io,json,struct,tarfile,urllib.request,urllib.parse,uuid,zipfile
          import pefile,re
          from unicorn import Uc,UC_ARCH_X86,UC_MODE_64,UC_MODE_32
          from unicorn.x86_const import UC_X86_REG_RCX,UC_X86_REG_RSP,UC_X86_REG_RAX,UC_X86_REG_RIP,UC_X86_REG_EIP,UC_X86_REG_EAX,UC_X86_REG_ESP
          
          OUT=Path('cef-crossarch-report.json')
          VALVE_FILE='bins_cef_win64.zip.0bad5abe29375d80e5bb0eedf714329369140164'
          VALVE_SHA='e5e660226cc586c3cbc9a225f92e041664f228f83ef210574e39967c82c691cc'
          STOCK_VERSION='126.2.18+g3647d39+chromium-126.0.6478.183'
          report={}
          def fetch(url):
           with urllib.request.urlopen(url,timeout=150) as r:return r.read()
          def digest(data,algorithm='sha256'):return hashlib.new(algorithm,data).hexdigest()
          def file_nodes(text):
           tokens=[a if a else b for a,b in __import__('re').findall(r'"([^"\r\n]*)"|([{}])',text)]
           pos=0
           def parse():
            nonlocal pos
            d={}
            while pos<len(tokens):
             key=tokens[pos];pos+=1
             if key=='}':return d
             value=tokens[pos];pos+=1
             d[key]=parse() if value=='{' else value
            return d
           def walk(node,path=()):
            if isinstance(node,dict):
             if 'file' in node:yield path,node
             for k,v in node.items():yield from walk(v,path+(k,))
           return list(walk(parse()))
          def archive_members(blob,kind):
           if kind=='zip':
            with zipfile.ZipFile(io.BytesIO(blob)) as z:
             return {n:z.read(n) for n in z.namelist() if n.lower().endswith(('/libcef.dll','/chrome_elf.dll','/steamwebhelper.exe','/cef_api_hash.h','/cef_version.h')) or n.lower() in ('libcef.dll','chrome_elf.dll','steamwebhelper.exe')}
           with tarfile.open(fileobj=io.BytesIO(blob),mode='r:bz2') as z:
            return {m.name:z.extractfile(m).read() for m in z if m.isfile() and m.name.lower().endswith(('/libcef.dll','/chrome_elf.dll','/cef_api_hash.h','/cef_version.h'))}
          def pure_exports(pe,names):
           exports={e.name.decode():e.address for e in pe.DIRECTORY_ENTRY_EXPORT.symbols if e.name}
           assert pe.FILE_HEADER.Machine in (0x8664,0x14c)
           is64=pe.FILE_HEADER.Machine==0x8664
           base=pe.OPTIONAL_HEADER.ImageBase;image=pe.get_memory_mapped_image();size=(len(image)+0xfff)&~0xfff
           cpu=Uc(UC_ARCH_X86,UC_MODE_64 if is64 else UC_MODE_32);cpu.mem_map(base,size);cpu.mem_write(base,image)
           stack=0x200000000000 if is64 else 0x1000000;cpu.mem_map(stack,0x20000);sentinel=stack+0x1f000
           def invoke(name,arg):
            sp=stack+0x10000-16
            if is64:cpu.mem_write(sp,struct.pack('<Q',sentinel));cpu.reg_write(UC_X86_REG_RSP,sp);cpu.reg_write(UC_X86_REG_RCX,arg)
            else:cpu.mem_write(sp,struct.pack('<II',sentinel,arg));cpu.reg_write(UC_X86_REG_ESP,sp)
            cpu.emu_start(base+exports[name],sentinel,timeout=1000000,count=1000)
            assert cpu.reg_read(UC_X86_REG_RIP if is64 else UC_X86_REG_EIP)==sentinel,'pure export did not return within 1000 instructions'
            return cpu.reg_read(UC_X86_REG_RAX if is64 else UC_X86_REG_EAX)
           api={}
           for name in names:
            if name=='cef_api_hash':
             for arg in range(3):
              pointer=invoke(name,arg);assert base<=pointer<base+size
              value=bytes(cpu.mem_read(pointer,128)).split(b'\0')[0].decode('ascii');assert len(value)==40 and all(c in '0123456789abcdef' for c in value)
              api[str(arg)]=value
            elif name=='cef_version_info':api[name]=[invoke(name,arg)&0xffffffff for arg in range(8)]
           return api
          
          def identity(label,name,data):
           p=pefile.PE(data=data);exports={e.name.decode():e.forwarder.decode() if e.forwarder else None for e in getattr(p,'DIRECTORY_ENTRY_EXPORT',type('E',(),{'symbols':[]})).symbols if e.name};imports={}
           for e in getattr(p,'DIRECTORY_ENTRY_IMPORT',[]):imports[e.dll.decode().lower()]=sorted(i.name.decode() if i.name else '#'+str(i.ordinal) for i in e.imports)
           pdb=[]
           for e in getattr(p,'DIRECTORY_ENTRY_DEBUG',[]):
            if e.struct.Type==2:
             b=p.get_data(e.struct.AddressOfRawData,e.struct.SizeOfData)
             if b[:4]==b'RSDS':pdb.append({'guid':str(uuid.UUID(bytes_le=b[4:20])).upper(),'age':struct.unpack_from('<I',b,20)[0],'basename':b[24:].split(b'\0')[0].decode(errors='replace').replace('\\','/').split('/')[-1]})
           versions={}
           for group in getattr(p,'FileInfo',[]):
            for entry in group:
             for table in getattr(entry,'StringTable',[]):versions.update({k.decode():v.decode(errors='replace') for k,v in table.entries.items() if k in [b'FileVersion',b'ProductVersion',b'LastChange']})
           out={'member':name,'sha256':digest(data),'machine':hex(p.FILE_HEADER.Machine),'image_size':hex(p.OPTIONAL_HEADER.SizeOfImage),'timestamp':hex(p.FILE_HEADER.TimeDateStamp),'pdb':pdb,'version':versions,'exports':exports,'imports':imports}
           if name.lower().endswith('libcef.dll'):out['api']=pure_exports(p,['cef_api_hash','cef_version_info'])
           report[label]=out;print('IDENTITY',label,json.dumps({k:v for k,v in out.items() if k not in ['exports','imports']}),flush=True)
           return out
          
          PACKAGES=[('current64cef','bins_cef_win64.zip.0bad5abe29375d80e5bb0eedf714329369140164','e5e660226cc586c3cbc9a225f92e041664f228f83ef210574e39967c82c691cc'),('current64helper','bins_webhelpers_win64.zip.24cccba0a57045dd639e797a63facc0f56d9cd4c','697b728a706405a73bbcfcb530f609d414968c2ba189ae87aba83715ff9394c6')]
          manifests={}
          for arch in ['win32','win64']:
           data=fetch('https://client-update.akamai.steamstatic.com/steam_client_'+arch);manifests[arch]=(data,file_nodes(data.decode()));report[arch+'_manifest_sha256']=digest(data)
          assert report['win32_manifest_sha256']=='4b8aa78d95dd7a1475c7849c3e783b136452d34be67342b53728799d697c4823'
          for label,family in [('legacy32cef','bins_cef_win32'),('legacy32helper','bins_webhelpers_win32')]:
           candidates=[(path,n) for path,n in manifests['win32'][1] if path and path[-1]==family]
           assert len(candidates)==1,[(p,n['file']) for p,n in candidates]
           path,node=candidates[0];PACKAGES.append((label,node['file'],node['sha2']));print('I386_DEFAULT_PACKAGE',label,node['file'],node['sha2'],flush=True)
          raw={}
          for label,file,sha in PACKAGES:
           manifest,nodes=manifests['win32' if '32' in label else 'win64'];assert any(n['file']==file and n.get('sha2')==sha for _,n in nodes),'archive not present in corresponding current official manifest'
           data=fetch('https://client-update.akamai.steamstatic.com/'+file);assert digest(data)==sha;report[label+'_archive']={'file':file,'sha256':sha}
           for name,member in archive_members(data,'zip').items():
            if label.startswith('legacy32') and '/cef.win7/' not in name.lower():continue
            expected=0x14c if label.startswith('legacy32') else 0x8664
            assert pefile.PE(data=member).FILE_HEADER.Machine==expected,(label,name,'unexpected architecture')
            key=label+'_'+name.rsplit('/',1)[-1];assert key not in raw,'ambiguous member';identity(key,name,member);raw[key]=member
           del data
          patterns=[rb'(?:CLIENT|STEAM)[A-Z_]*INTERFACE_VERSION[0-9]{1,5}',rb'SteamClient[0-9]{1,5}',rb'CLIENT[A-Z_]+_VERSION[0-9]{1,5}',rb'(?:IClient|IHTML|IWeb)[A-Za-z0-9_]{1,80}',rb'(?:SteamClient|Browser|WebHelper|IPC|CEF)[A-Za-z0-9_:.-]{2,90}']
          for label in ['current64','legacy32']:
           helper=report[label+'helper_steamwebhelper.exe'];cef=report[label+'cef_libcef.dll'];data=raw[label+'helper_steamwebhelper.exe'];strings=[]
           for pattern in patterns:strings+= [x.decode('ascii') for x in re.findall(pattern,data)]
           literals=sorted(set(strings))
           all_strings=[x.decode('ascii') for x in re.findall(rb'[\x20-\x7e]{6,300}',data)]
           all_strings += [x.decode('utf-16le') for x in re.findall(rb'(?:[\x20-\x7e]\x00){6,160}',data)]
           transport=[x for x in all_strings if (('html' in x.lower() or 'chrome' in x.lower()) and any(k in x.lower() for k in ['pipe','ipc','shared','mapping','socket','mutex','event'])) or '.proto' in x or '\\\\pipe\\' in x]
           report[label+'_transport_literal_candidates']=sorted(set(transport))[:100]
           print('TRANSPORT_LITERALS',label,json.dumps(report[label+'_transport_literal_candidates']),flush=True)
           report[label+'_bindings']={'helper_cef_imports_missing':sorted(set(helper['imports'].get('libcef.dll',[]))-set(cef['exports'])),'helper_contains_platform_api_hash':cef['api']['0'].encode() in data,'helper_contains_universal_api_hash':cef['api']['1'].encode() in data,'literal_candidates':literals,'non_system_import_dlls':sorted(helper['imports'])}
           print('BINDINGS',label,json.dumps(report[label+'_bindings'],sort_keys=True),flush=True)
          old=report['legacy32cef_libcef.dll'];new=report['current64cef_libcef.dll'];oldh=report['legacy32helper_steamwebhelper.exe'];newh=report['current64helper_steamwebhelper.exe']
          report['comparison']={'universal_api_hash_equal':old['api']['1']==new['api']['1'],'cef_commit_equal':old['api']['2']==new['api']['2'],'cef_version_equal':old['api']['cef_version_info']==new['api']['cef_version_info'],'old_helper_cef_imports_absent_from_current64':sorted(set(oldh['imports'].get('libcef.dll',[]))-set(new['exports'])),'new_helper_cef_imports_absent_from_legacy32':sorted(set(newh['imports'].get('libcef.dll',[]))-set(old['exports'])),'literal_only_current':sorted(set(report['current64_bindings']['literal_candidates'])-set(report['legacy32_bindings']['literal_candidates'])),'literal_only_legacy':sorted(set(report['legacy32_bindings']['literal_candidates'])-set(report['current64_bindings']['literal_candidates'])),'literal_common':sorted(set(report['legacy32_bindings']['literal_candidates'])&set(report['current64_bindings']['literal_candidates']))}
          print('COMPARISON',json.dumps(report['comparison'],sort_keys=True),flush=True);OUT.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n');print('REPORT',OUT.name,flush=True)
          PYINSPECT
      - uses: actions/upload-artifact@v4
        with:
          name: cef-crossarch-report
          path: cef-crossarch-report.json
