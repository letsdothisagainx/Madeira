name: Read verified CEF ABI report
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read previously verified ABI artifact only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess,io,zipfile,json,hashlib
          data=subprocess.check_output(['gh','api','repos/letsdothisagainx/Madeira/actions/artifacts/13203068345/zip'])
          assert hashlib.sha256(data).hexdigest()=='cc891c56c10b4c9536a69e2b73151b456ee9ef8aff86a265c1e2d86b067712c6'
          with zipfile.ZipFile(io.BytesIO(data)) as z: report=json.loads(z.read('cef-abi-report.json'))
          for key in ['stock_archive','valve_manifest','helper_archive']:print('ARCHIVE',key,json.dumps(report[key],sort_keys=True))
          stock=report['stock_chrome_elf.dll']['exports']
          for key in ['valve_chrome_elf.dll','stock_chrome_elf.dll']:print('ELF_EXPORTS',key,json.dumps(report[key]['exports'],sort_keys=True))
          for key in ['valve_libcef.dll','valve_steamwebhelper.exe']:
           imports=report[key]['imports'].get('chrome_elf.dll',[])
           print('ELF_IMPORTS',key,json.dumps(imports),'MISSING_STOCK',json.dumps(sorted(set(imports)-set(stock))))
          print('FULL_REPORT',json.dumps(report,sort_keys=True))
          PY
