name: Inspect exact browser domain and response contracts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact official binaries without execution
        run: |
          python3 -m venv "$RUNNER_TEMP/domain-tools"
          "$RUNNER_TEMP/domain-tools/bin/pip" install pefile==2024.8.26 capstone==5.0.6
          "$RUNNER_TEMP/domain-tools/bin/python" tools/run-domain-inspection.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-domain-contract-report
          path: domain-report.json
          retention-days: 3
