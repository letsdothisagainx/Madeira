name: Read exact official transport image for static analysis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-image:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned public image; never execute PE
        run: python3 tools/fetch-helpers-pe.py
