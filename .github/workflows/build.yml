name: Inspect remaining FEX native producers 4a704
on:
  push:
    branches: [codex/inspect-fex-remaining-4a704]
permissions:
  actions: read
  contents: read
jobs:
  inspect-owned-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Madeira-ipa
          run-id: 42697773488
          github-token: ${{ github.token }}
          path: evidence
      - name: Install pinned disassembler
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Inspect only packaged owned native modules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, plistlib, struct, subprocess, zipfile
          archives=list(Path('evidence').rglob('*.ipa'))
          assert len(archives)==1, archives
          with zipfile.ZipFile(archives[0]) as z:
              info=plistlib.loads(z.read('Payload/Madeira.app/Info.plist'))
              print('INSTALLED_BUILD',info['MadeiraBuild'],flush=True)
              assert info['MadeiraBuild'].endswith(' source=4a70400f02a6892cbef430fd2be4b5c5d309bc4f')
              for farm,basename,codes,targets,expected in [
                  ('arm64ec-windows','xtajit64.dll',[0x1b94a4,0x1b9538,0x118640,0x11864c,0x1081c],[0x3ccfc8,0x3ccfe0,0x3c4b00,0x3c4240,0x3bd374],{0x1b94a4:0xb9001a68,0x1b9538:0xb9001a69,0x118640:0xf824023f,0x11864c:0xf8240237}),
                  ('aarch64-windows','xtajit.dll',[0x102e14,0x1a1c8c,0x1a1d24],[0x386e38,0x387060],{0x102e14:0x880b7d0a,0x1a1c8c:0xb9001a69,0x1a1d24:0xb9001a7f}),
                  ('arm64ec-windows','ntdll.dll',[0x69ca8,0x69d20],[],{0x69ca8:0x4809fe68,0x69d20:0x880afe69})]:
                  member='Payload/Madeira.app/'+farm+'/'+basename
                  data=z.read(member)
                  out=Path('evidence')/(farm+'-'+basename)
                  out.write_bytes(data)
                  pe=struct.unpack_from('<I',data,60)[0]
                  opt=pe+24
                  count=struct.unpack_from('<H',data,pe+6)[0]
                  sections=opt+struct.unpack_from('<H',data,pe+20)[0]
                  def raw(rva):
                      for i in range(count):
                          at=sections+40*i
                          size,base,length,offset=struct.unpack_from('<IIII',data,at+8)
                          if base<=rva and rva-base+4<=length:
                              return struct.unpack_from('<I',data,offset+rva-base)[0]
                      raise AssertionError(hex(rva))
                  print('EXACT_OPCODE_PROOF',basename,json.dumps({hex(rva):hex(raw(rva)) for rva in expected}),flush=True)
                  for rva,opcode in expected.items():
                      assert raw(rva)==opcode,(basename,hex(rva),hex(raw(rva)),hex(opcode))
                  command=['python3','tools/build/inspect-fex-image.py',str(out),'--context','80']
                  for rva in codes:command += ['--code-rva',hex(rva)]
                  for rva in targets:command += ['--data-rva',hex(rva)]
                  symbols,symbol_count=struct.unpack_from('<II',data,pe+12)
                  if symbols and symbol_count:
                      strings=symbols+18*symbol_count
                      string_bytes=struct.unpack_from('<I',data,strings)[0]
                      rows=[]
                      i=0
                      while i<symbol_count:
                          at=symbols+18*i
                          name=data[at:at+8]
                          value,section=struct.unpack_from('<Ih',data,at+8)
                          aux=data[at+17]
                          if name[:4]==bytes(4):
                              pos=struct.unpack_from('<I',name,4)[0]
                              name=data[strings+pos:data.index(0,strings+pos,strings+string_bytes)] if 4<=pos<string_bytes else b''
                          else:name=name.split(bytes(1))[0]
                          if 0<section<=count:
                              va=struct.unpack_from('<I',data,sections+40*(section-1)+12)[0]+value
                              if b'InvalidationTracker' in name or b'IosXpFex' in name or b'ProcessTerminating' in name:
                                  rows.append((hex(va),name.decode(errors='replace')))
                          i+=1+aux
                      print('OWNED_OBJECT_SYMBOLS',basename,json.dumps(sorted(rows)),flush=True)
                      subprocess.run(command,check=True)
                  else:
                      from capstone import Cs,CS_ARCH_ARM64,CS_MODE_LITTLE_ENDIAN
                      decoder=Cs(CS_ARCH_ARM64,CS_MODE_LITTLE_ENDIAN)
                      print('COFF_UNAVAILABLE',basename,'using exact opcodes and ARM64 disassembly',flush=True)
                      for rva in codes:
                          start=max(0,rva-80)
                          block=b''.join(struct.pack('<I',raw(a)) for a in range(start,rva+80,4))
                          for insn in decoder.disasm(block,start):
                              print(hex(insn.address),insn.bytes.hex(),insn.mnemonic,insn.op_str,flush=True)
          PY
