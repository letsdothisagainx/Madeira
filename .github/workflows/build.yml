name: Inspect exact FEX history 8bd
on:
  push:
    branches: [codex/inspect-fex-history-8bd]
permissions:
  actions: read
  contents: read
jobs:
  inspect-owned-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Madeira-ipa
          run-id: 42591313733
          github-token: ${{ github.token }}
          path: evidence
      - name: Install pinned disassembler
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Inspect only packaged owned native CPUs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, plistlib, struct, subprocess, zipfile
          archives=list(Path('evidence').rglob('*.ipa'))
          assert len(archives)==1, archives
          with zipfile.ZipFile(archives[0]) as z:
              info=plistlib.loads(z.read('Payload/Madeira.app/Info.plist'))
              print('INSTALLED_BUILD',info['MadeiraBuild'],flush=True)
              assert info['MadeiraBuild'].endswith(' source=8bd3785c7f4a422ffdb20033510db46ea0fdcd52')
              for farm,basename,codes,targets,expected in [
                  ('arm64ec-windows','xtajit64.dll',[0x147fc,0x14804,0x14808,0x14814,0x1185f0,0x1185fc],[0x3bd348,0x3bd368,0x3bd388,0x3bd3a8,0x3ccf88,0x3c4ac0],{0x147fc:0xf9005d79,0x14804:0xf9006d6a,0x14808:0xf9007d74,0x14814:0xf9008d6c,0x1185fc:0xf8240237}),
                  ('aarch64-windows','xtajit.dll',[0x13ae8,0x13af0,0x13b00,0x102e20],[0x37f330,0x37f350,0x386e18],{0x13ae8:0xf9005d37,0x13af0:0xf9006d2a,0x13b00:0xf9008d2c,0x102e20:0x880b7d0a})]:
                  member='Payload/Madeira.app/'+farm+'/'+basename
                  data=z.read(member)
                  out=Path('evidence')/basename
                  out.write_bytes(data)
                  pe=struct.unpack_from('<I',data,60)[0]
                  opt=pe+24
                  count=struct.unpack_from('<H',data,pe+6)[0]
                  sections=opt+struct.unpack_from('<H',data,pe+20)[0]
                  def raw(rva):
                      for i in range(count):
                          at=sections+40*i
                          size,base,length,offset=struct.unpack_from('<IIII',data,at+8)
                          if base<=rva and rva-base+4<=length:
                              return struct.unpack_from('<I',data,offset+rva-base)[0]
                      raise AssertionError(hex(rva))
                  print('CPU_EXACT_OPCODE_PROOF',basename,json.dumps({hex(rva):hex(raw(rva)) for rva in expected}),flush=True)
                  for rva,opcode in expected.items():
                      assert raw(rva)==opcode,(basename,hex(rva),hex(raw(rva)),hex(opcode))
                  command=['python3','tools/build/inspect-fex-image.py',str(out),'--context','80']
                  for rva in codes:command += ['--code-rva',hex(rva)]
                  for rva in targets:command += ['--data-rva',hex(rva)]
                  subprocess.run(command,check=True)
          PY
