name: Inspect genuine browser routing compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MADEIRA_VALVE_ARCHIVE_CACHE: ${{ github.workspace }}/.valve-package-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .valve-package-cache
          key: valve-htmlipc-inspection-${{ github.run_id }}
          restore-keys: valve-htmlipc-v1-1792618285-1769731672-
      - name: Inspect exact current native and JavaScript feature selection without executing Steam
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install pefile==2024.8.26 capstone==5.0.6
          "$RUNNER_TEMP/tools/bin/python" tools/browser-routing/probe_api_uses.py
