name: Inspect exact HTML IPC factory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-htmlipc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect hash-pinned current Steam core factory and transport references
        run: |
          python3 -m venv "$RUNNER_TEMP/htmlipc-tools"
          "$RUNNER_TEMP/htmlipc-tools/bin/pip" install pefile==2024.8.26 capstone==5.0.6
          "$RUNNER_TEMP/htmlipc-tools/bin/python" tools/inspect-htmlipc-factory.py
