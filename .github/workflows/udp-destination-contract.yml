name: Research native UDP destination semantics
on:
  workflow_dispatch:
  push:
    branches: ['codex/inspect-*']
    paths:
      - tests/integration/udp-destination-contract.c
      - tools/run-udp-destination-contract.py
      - .github/workflows/udp-destination-contract.yml
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise real Windows UDP destinations and both send APIs
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.architecture }}
          if errorlevel 1 exit /b %errorlevel%
          python tools\run-udp-destination-contract.py --output udp-reference-${{ matrix.architecture }}
          if errorlevel 1 exit /b %errorlevel%
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: udp-native-windows-${{ matrix.architecture }}
          path: udp-reference-${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 3
  darwin:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise real Darwin sendmsg with Wine-style sockaddr conversion
        run: python3 tools/run-udp-destination-contract.py --output udp-reference-darwin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: udp-native-darwin
          path: udp-reference-darwin/
          if-no-files-found: error
          retention-days: 3
