name: Check exact Valve CEF symbol availability
on:
  push:
    branches: [codex/inspect-cef-renderer-20261105]
    paths: [.github/workflows/inspect-cef-renderer.yml]
permissions:
  contents: read
jobs:
  symbols:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Request exact GUID and age from symbol endpoints
        run: |
          python3 - <<'PYINSPECT'
          import json,urllib.request,urllib.error
          from concurrent.futures import ThreadPoolExecutor
          GUID='4D133C5B4FBE41474C4C44205044422E1'
          urls=[base+'/libcef.dll.pdb/'+GUID+'/'+file for base in ['https://cef-symbols.spotifycdn.com','https://cef-builds.spotifycdn.com/symbols','https://chromium-browser-symsrv.commondatastorage.googleapis.com'] for file in ['libcef.dll.pdb','file.ptr']]
          def check(url):
           try:
            req=urllib.request.Request(url,headers={'User-Agent':'Madeira-exact-symbol-inspection/1.0','Range':'bytes=0-255'})
            with urllib.request.urlopen(req,timeout=20) as r:
             sample=r.read(256)
             return dict(url=url,status=r.status,final_url=r.geturl(),content_type=r.headers.get('content-type'),content_length=r.headers.get('content-length'),sample_hex=sample.hex())
           except urllib.error.HTTPError as e:return dict(url=url,status=e.code,reason=str(e.reason))
           except Exception as e:return dict(url=url,error=type(e).__name__,reason=str(e))
          with ThreadPoolExecutor(max_workers=6) as pool:
           for result in pool.map(check,urls): print('EXACT_SYMBOL_REQUEST',json.dumps(result),flush=True)
          print('FINISHED exact GUID symbol availability requests; only 256-byte identity probes; no symbols presumed',flush=True)
          PYINSPECT
