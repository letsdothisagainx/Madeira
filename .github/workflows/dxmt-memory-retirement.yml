name: Verify DXMT completed resource retirement

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/pr-build-*']
    paths:
      - 'build/dxmt-ios/**'
      - 'tools/build/*dxmt*'
      - 'tools/check-dxmt-memory-package.py'
      - 'tests/host/check-dxmt-*'
      - '.github/workflows/dxmt-memory-retirement.yml'
  pull_request:
    paths:
      - 'build/dxmt-ios/**'
      - 'tools/build/*dxmt*'
      - 'tools/check-dxmt-memory-package.py'
      - 'tests/host/check-dxmt-*'
      - '.github/workflows/dxmt-memory-retirement.yml'

permissions:
  contents: read

concurrency:
  group: dxmt-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-ownership:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git submodule update --init --depth 1 dxmt
      - name: Exercise production methods with controlled resource and GPU completion edges
        env:
          CC: clang
          CXX: clang++
        run: |
          python3 tests/host/check-dxmt-memory-pressure.py
          python3 tests/host/check-dxmt-dynamic-memory.py
          python3 tests/host/check-dxmt-upload-memory.py
          python3 tests/host/check-dxmt-memory-build.py
          python3 tests/host/check-dxmt-census-heap.py
          python3 tests/host/check-dxmt-perf-heap.py
