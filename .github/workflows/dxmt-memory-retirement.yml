name: Verify DXMT completed resource retirement

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/pr-build-*']
    paths:
      - 'build/dxmt-ios/**'
      - 'tools/build/*dxmt*'
      - 'tools/check-dxmt-memory-package.py'
      - 'tests/host/check-dxmt-*'
      - 'tests/host/check-texture-rejection-operands.py'
      - 'tests/host/check-cs2-texture-memory-profile.py'
      - 'tests/host/check-cs2-video-profile.py'
      - 'tests/host/check-metal-descriptor-lifetime.py'
      - 'app/Madeira/Library.swift'
      - 'app/Madeira/ContentView.swift'
      - 'build/ntdll-unix/server_ios.c'
      - '.github/workflows/dxmt-memory-retirement.yml'
  pull_request:
    paths:
      - 'build/dxmt-ios/**'
      - 'tools/build/*dxmt*'
      - 'tools/check-dxmt-memory-package.py'
      - 'tests/host/check-dxmt-*'
      - 'tests/host/check-texture-rejection-operands.py'
      - 'tests/host/check-cs2-texture-memory-profile.py'
      - 'tests/host/check-cs2-video-profile.py'
      - 'tests/host/check-metal-descriptor-lifetime.py'
      - 'app/Madeira/Library.swift'
      - 'app/Madeira/ContentView.swift'
      - 'build/ntdll-unix/server_ios.c'
      - '.github/workflows/dxmt-memory-retirement.yml'

permissions:
  contents: read

concurrency:
  group: dxmt-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-ownership:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The lifecycle fixture compiles Wine's real PE types in addition to DXMT.
      - run: git submodule update --init --depth 1 wine dxmt
      - name: Exercise production methods with controlled resource and GPU completion edges
        env:
          CC: clang
          CXX: clang++
        run: |
          python3 tests/host/check-native-heap-relief.py
          python3 tests/host/check-dxmt-memory-pressure.py
          python3 tests/host/check-dxmt-initializer-failure.py --sanitize
          if [[ "$RUNNER_OS" == macOS ]]; then
            python3 tests/host/check-dxmt-growth-events.py --require-darwin
            python3 tests/host/check-cs2-texture-memory-profile.py --require-swift
            python3 tests/host/check-cs2-video-profile.py --require-swift
            python3 tests/host/check-pool-startup-budget.py --require-swift
          else
            python3 tests/host/check-dxmt-growth-events.py
            python3 tests/host/check-cs2-texture-memory-profile.py
            python3 tests/host/check-cs2-video-profile.py
            python3 tests/host/check-pool-startup-budget.py
          fi
          python3 tests/host/check-dxmt-resource-budget.py
          python3 tests/host/check-fex-view-lifecycle.py
          python3 tests/host/check-dxmt-texture-accounting.py
          python3 tests/host/check-dxmt-texture-admission.py
          python3 tests/host/check-texture-rejection-operands.py
          python3 tests/host/check-dxmt-transient-recovery.py --sanitize
          python3 tests/host/check-dxmt-mip-profile.py
          python3 tests/host/check-metal-descriptor-lifetime.py
          python3 tests/host/check-dxmt-dynamic-memory.py
          python3 tests/host/check-dxmt-upload-memory.py
          python3 tests/host/check-dxmt-memory-build.py
          python3 tests/host/check-dxmt-census-heap.py
          python3 tests/host/check-dxmt-perf-heap.py
          python3 tests/host/check-dxmt-command-state.py
          python3 tests/host/check-dxmt-native-batch.py
