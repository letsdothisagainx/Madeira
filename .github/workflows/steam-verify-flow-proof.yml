name: Prove current Steam records and verification scripts through Wine
on:
  push:
    branches: ['codex/verify-steam-flow-70275bc-20261109-mw9w8ivu']
permissions:
  contents: read
jobs:
  scripts:
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Load pinned Wine printf source before service record transport regression
        run: git submodule update --init --depth 1 wine
      - name: Confirm source identity and generate actual Swift client scripts
        run: |
          git rev-parse HEAD
          git diff --exit-code 70275bc206c91226ada539f15910e773e0e3aba0 -- app build tests tools FEX wine dxmt madeira-dock madeira-d3d12
          python3 tests/host/check-steam-service.py
          python3 tests/host/check-native-steam-play.py --emit-script-dir "$RUNNER_TEMP/service-scripts"
          test -s "$RUNNER_TEMP/service-scripts/steam-client.cmd"
          test -s "$RUNNER_TEMP/service-scripts/steam-applaunch.cmd"
          test -s "$RUNNER_TEMP/service-scripts/steam-verify.cmd"
          shasum -a 256 "$RUNNER_TEMP/service-scripts/"*.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: service-native-client-scripts
          path: ${{ runner.temp }}/service-scripts/*.cmd
          if-no-files-found: error
          retention-days: 3
  scm-integration:
    needs: scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install isolated Wine WoW64 and PE fixture compilers
        run: |
          sudo dpkg --add-architecture i386
          sudo sed -i 's@azure.archive.ubuntu.com@archive.ubuntu.com@g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wine wine64 wine32:i386 gcc-mingw-w64-x86-64-posix gcc-mingw-w64-i686-posix xvfb xauth
      - uses: actions/download-artifact@v4
        with:
          name: service-native-client-scripts
          path: .service-scripts
      - name: Confirm all three production scripts before running real Wine SCM
        run: |
          git diff --exit-code 70275bc206c91226ada539f15910e773e0e3aba0 -- app build tests tools FEX wine dxmt madeira-dock madeira-d3d12
          sha256sum .service-scripts/*.cmd
          xvfb-run -a python3 - <<'PY'
          import re
          import runpy
          import subprocess
          import sys
          actual_run = subprocess.run
          complete_running = 0
          observed_records = 0
          def observe_run(*args, **kwargs):
              global complete_running, observed_records
              result = actual_run(*args, **kwargs)
              output = result.stdout
              if isinstance(output, bytes):
                  for raw in output.splitlines(keepends=True):
                      if re.fullmatch(rb'\[steam-service\] [a-z0-9-]+=[0-9]+\r\n', raw):
                          observed_records += 1
                          complete_running += raw == b'[steam-service] service-state=4\r\n'
                          print('REAL-WINE-RECORD ' + raw.decode('ascii').rstrip('\r\n'), flush=True)
              return result
          subprocess.run = observe_run
          sys.argv = ['tests/integration/check-steam-service-startup.py', '--script-dir', '.service-scripts']
          runpy.run_path(sys.argv[0], run_name='__main__')
          assert complete_running > 0, 'no complete genuine SCM running record observed'
          print(f'PASS observed {observed_records} complete numeric producer records; {complete_running} actual SCM running records ended in CRLF', flush=True)
          PY
