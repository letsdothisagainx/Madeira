name: Publish verified IPA download

on:
  push:
    branches: [codex/cs2-live-memory-upload-reuse-20261116]
    paths: [.github/workflows/publish-verified-ipa.yml]
  workflow_dispatch:

# Delivery only: publish the exact successful candidate, never rebuild it or
# change the app revision. Keep write permission out of the compiler workflows.
permissions:
  actions: read
  contents: write

concurrency:
  group: publish-ipa-e50f8dfd
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: e50f8dfdcacc68495db607028bb615d0435ec2bd
      SOURCE_RUN: '45511231989'
      SOURCE_UUID: A51B832E-AEDE-3C5E-A20B-B9AB964321D9
      RELEASE_TAG: ipa-e50f8dfd
    steps:
      - name: Require the exact successful build and artifact
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + path]))
          run = api('/actions/runs/' + os.environ['SOURCE_RUN'])
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_REVISION']
          assert run['head_repository']['full_name'].lower() == repo.lower()
          assert run['path'] == '.github/workflows/build.yml'
          artifacts = api('/actions/runs/' + os.environ['SOURCE_RUN'] + '/artifacts?name=Madeira-ipa')['artifacts']
          assert len(artifacts) == 1
          artifact = artifacts[0]
          assert artifact['name'] == 'Madeira-ipa' and not artifact['expired']
          assert str(artifact['workflow_run']['id']) == os.environ['SOURCE_RUN']
          assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_REVISION']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', artifact['digest'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SOURCE_ARTIFACT=' + str(artifact['id']) + '\n')
              env.write('ARCHIVE_SHA256=' + artifact['digest'].split(':', 1)[1] + '\n')
          tag = api('/git/ref/tags/' + os.environ['RELEASE_TAG'])
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == os.environ['SOURCE_REVISION']
          print('PASS exact successful build, source revision and immutable artifact identity')
          PY
      - uses: actions/checkout@v4
        with:
          ref: e50f8dfdcacc68495db607028bb615d0435ec2bd
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: delivery-tools
          persist-credentials: false
      - name: Download and verify the already built IPA
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$RUNNER_TEMP/Madeira-ipa.zip"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/Madeira-ipa.zip" | sha256sum --check --strict
          mkdir release-output
          unzip -q "$RUNNER_TEMP/Madeira-ipa.zip" -d release-output
          test -s release-output/Madeira.ipa
          python3 tools/build/native-provenance.py check --root "$GITHUB_WORKSPACE" --revision "$SOURCE_REVISION" --ipa release-output/Madeira.ipa
          python3 delivery-tools/tests/host/check-store-recovery-package-inspector.py
          python3 delivery-tools/tools/check-store-recovery-package.py --ipa release-output/Madeira.ipa --revision "$SOURCE_REVISION" --require-pressure-boundary --require-recovery-scope --require-cs2-tso-profile > release-output/recovery-package.json
          cat release-output/recovery-package.json
          python3 - <<'PY'
          import json, os
          package = json.load(open('release-output/recovery-package.json'))
          assert package['bundleIdentifier'] == 'com.willfaust.madeora', 'installation identity changed'
          assert package['pressureBoundaryRequired'] is True
          assert package['recoveryScopeRequired'] is True
          assert package['cs2TSOProfileRequired'] is True
          assert package['nativeUUID'] == os.environ['SOURCE_UUID']
          print('PASS existing installation identity and compiled scoped recovery/pressure producers')
          PY
          python3 delivery-tools/tools/check-run-evidence-package.py --ipa release-output/Madeira.ipa > release-output/run-evidence-package.json
          (cd release-output && sha256sum Madeira.ipa > SHA256SUMS)
      - name: Publish the same IPA as a stable prerelease asset
        run: |
          cat > "$RUNNER_TEMP/ipa-release-notes.txt" <<'NOTES'
          Madeira Run23 private-data paging repair candidate.

          App source: e50f8dfdcacc68495db607028bb615d0435ec2bd
          Native UUID: A51B832E-AEDE-3C5E-A20B-B9AB964321D9
          IPA SHA256: 0984735daaabf8ff6b2f2a2258f92a412424cd19b91d9a7f150c008e07bdc6da
          IPA build: https://github.com/letsdothisagainx/Madeira/actions/runs/45511231989
          Normal Linux/macOS/iPhone SDK checks: https://github.com/letsdothisagainx/Madeira/actions/runs/45511239027
          Matching symbols: Madeira-native-symbols:45511231989

          Normal runtime behavior changed: fresh qualified private CS2 file-backed data mappings request MADV_RANDOM, including fresh-zero decommit replacements. Published XNU uses that persistent hint to limit default speculative page-in clustering. This targets potential working-set/pager amplification in the kernel-heavy normal-store workload. It is a conservative paging optimization, not a confirmed diagnosis of the device kernel or a gameplay-success claim.

          The existing native thread registration and validated CS2 process identity qualify the current owner/lease/PID/TID/TEB and private-view creation context without a registry lock or sampled-address rule. Images, executable/ARM64EC/system/write-watch and foreign/stale views retain the prior path. There is no live migration, discard, page warming, protection change, anonymous-memory increase, TSO change, offset-reuse shortcut or reserve reduction. Advice failure preserves the valid allocation and errno. Existing VM/backing records retain bounded policy receipts and timing; accepted advice is not measured FPS improvement.

          The independent first post-activation stall capture now runs before ordinary incident-priority suppression. It marks saved only after nonempty complete writes/close, removes failed partial output and permits retry. Higher-priority first/recent resource failures remain protected. The actual tested incident method reproduces resource-before-activation suppression; the corrected ordinary replay exports the stall file through activation/stall/disconnect and preserves the resource window. Disk/RAM budgets and the single Export Run ZIP remain.

          Ordinary Linux/macOS validation executes the actual identity/policy functions on a small initialized RW shared file mapping, checks every byte, main/worker lifetime exclusions, bounds and errno, and on macOS queries actual RANDOM behavior with unchanged RW protection. Existing upload/fence/reserve, input, retention, privacy, rotation, preceding-run, ZIP/share and native/package checks pass. No deliberate crash, fault injection, protected-memory/page-revocation experiment or captured instruction execution was performed.

          Remaining uncertainty: the dominant device kernel operation is not established. Warm host validation does not prove reduced phone page-ins, kernel CPU, loading time or Present gaps; reduced speculative clustering can also reduce useful sequential prefetch. The older destination-only allocation shortage remains unresolved: 673400 usable bytes cannot hold a 699048-byte destination before staging. No live capacity is forcibly reclaimed and no texture-memory improvement is claimed. No actual controller input was observed in the supplied run; no downstream input change was made. Responsive team selection, sustained remote play, movement/aim/buttons and visual correctness require device validation.

          Preserved: bundle com.willfaust.madeora, installation/prefix/game/account/configuration, Steam session and launch handoff, source freshness, bounded input queue, failure retention, JIT entitlements, 1152-MiB pool with 768/384 partition, code-buffer reuse, recovery/QoS, STLR/TSO/half-barrier, memory safeguards, resource contents and GPU lifetimes. No graphics setting or network timeout change. Install over the existing app using the established signing workflow; do not uninstall or delete data.

          Details: https://github.com/letsdothisagainx/Madeira/blob/e50f8dfdcacc68495db607028bb615d0435ec2bd/docs/cs2-run23-private-pager-policy.md
          Normal workflow: Run CS2, encounter the problem, tap Export Run, share one ZIP. Download Madeira.ipa below; SHA256SUMS verifies it.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title 'Madeira e50f8dfd - Run23 private-data paging candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title 'Madeira e50f8dfd - Run23 private-data paging candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt" --draft --prerelease
          fi
          gh release upload "$RELEASE_TAG" release-output/Madeira.ipa release-output/SHA256SUMS release-output/recovery-package.json release-output/run-evidence-package.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Verify the public download without authentication
        run: |
          public_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Madeira.ipa"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "$public_url" --output "$RUNNER_TEMP/public-Madeira.ipa"
          cmp release-output/Madeira.ipa "$RUNNER_TEMP/public-Madeira.ipa"
          printf 'Verified public IPA: %s\n' "$public_url"
          printf '## Stable IPA download\n\n[%s](%s)\n\nSource: `%s`\n\n' Madeira.ipa "$public_url" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          cat release-output/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
