name: Publish verified IPA download

on:
  push:
    branches: [codex/cs2-live-memory-upload-reuse-20261116]
    paths: [.github/workflows/publish-verified-ipa.yml]
  workflow_dispatch:

# Delivery only: publish the exact successful candidate, never rebuild it or
# change the app revision. Keep write permission out of the compiler workflows.
permissions:
  actions: read
  contents: write

concurrency:
  group: publish-ipa-482ac26f
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: 482ac26ffb81a2985310d64c697c61616f5134ed
      SOURCE_RUN: '45334065747'
      SOURCE_UUID: BE56EF9B-A68E-3BA6-9549-B06809C49E7D
      RELEASE_TAG: ipa-482ac26f
    steps:
      - name: Require the exact successful build and artifact
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + path]))
          run = api('/actions/runs/' + os.environ['SOURCE_RUN'])
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_REVISION']
          assert run['head_repository']['full_name'].lower() == repo.lower()
          assert run['path'] == '.github/workflows/build.yml'
          artifacts = api('/actions/runs/' + os.environ['SOURCE_RUN'] + '/artifacts?name=Madeira-ipa')['artifacts']
          assert len(artifacts) == 1
          artifact = artifacts[0]
          assert artifact['name'] == 'Madeira-ipa' and not artifact['expired']
          assert str(artifact['workflow_run']['id']) == os.environ['SOURCE_RUN']
          assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_REVISION']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', artifact['digest'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SOURCE_ARTIFACT=' + str(artifact['id']) + '\n')
              env.write('ARCHIVE_SHA256=' + artifact['digest'].split(':', 1)[1] + '\n')
          tag = api('/git/ref/tags/' + os.environ['RELEASE_TAG'])
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == os.environ['SOURCE_REVISION']
          print('PASS exact successful build, source revision and immutable artifact identity')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 482ac26ffb81a2985310d64c697c61616f5134ed
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: delivery-tools
          persist-credentials: false
      - name: Download and verify the already built IPA
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$RUNNER_TEMP/Madeira-ipa.zip"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/Madeira-ipa.zip" | sha256sum --check --strict
          mkdir release-output
          unzip -q "$RUNNER_TEMP/Madeira-ipa.zip" -d release-output
          test -s release-output/Madeira.ipa
          python3 tools/build/native-provenance.py check --root "$GITHUB_WORKSPACE" --revision "$SOURCE_REVISION" --ipa release-output/Madeira.ipa
          python3 delivery-tools/tests/host/check-store-recovery-package-inspector.py
          python3 delivery-tools/tools/check-store-recovery-package.py --ipa release-output/Madeira.ipa --revision "$SOURCE_REVISION" --require-pressure-boundary --require-recovery-scope --require-cs2-tso-profile > release-output/recovery-package.json
          cat release-output/recovery-package.json
          python3 - <<'PY'
          import json, os
          package = json.load(open('release-output/recovery-package.json'))
          assert package['bundleIdentifier'] == 'com.willfaust.madeora', 'installation identity changed'
          assert package['pressureBoundaryRequired'] is True
          assert package['recoveryScopeRequired'] is True
          assert package['cs2TSOProfileRequired'] is True
          assert package['nativeUUID'] == os.environ['SOURCE_UUID']
          print('PASS existing installation identity and compiled scoped recovery/pressure producers')
          PY
          python3 delivery-tools/tools/check-run-evidence-package.py --ipa release-output/Madeira.ipa > release-output/run-evidence-package.json
          (cd release-output && sha256sum Madeira.ipa > SHA256SUMS)
      - name: Publish the same IPA as a stable prerelease asset
        run: |
          cat > "$RUNNER_TEMP/ipa-release-notes.txt" <<'NOTES'
          Installable Madeira Run19 candidate: bounded real texture-upload growth and trustworthy resource/guest-exit evidence.

          App source: 482ac26ffb81a2985310d64c697c61616f5134ed
          Native UUID: BE56EF9B-A68E-3BA6-9549-B06809C49E7D
          IPA SHA256: bf11835640f7a010e46476df50d9e1b92a7fd1f246bb0e5fc0bfd4982ceaec60
          IPA build: https://github.com/letsdothisagainx/Madeira/actions/runs/45334065747
          Normal Linux/macOS/iPhone SDK checks: https://github.com/letsdothisagainx/Madeira/actions/runs/45333022325
          Matching symbols: Madeira-native-symbols:45334065747

          The production fix changes real DXMT allocation, not just its forecast. The old compact-upload policy allocated an entire batch when that batch was smaller than 32 MiB. Under pressure, this candidate selects a bounded allocation class from the genuine native headroom and outstanding credits. Oversized subresources transfer through format-block/row/depth chunks, including mips, arrays and cube faces. Reuse requires the actual GPU event; the same physical safety floor and full destination-plus-growth admission remain enforced. Waiting and CPU command retries remain bounded. Existing completed blocks may be reused without charging nonexistent additional growth.

          A normal owned-byte fixture compiled the actual staged forecast, ring and initializer. Its controlled BC7 case changes real staging from the baseline forecast of 22,373,120 bytes to one allocated/reused 8,388,608-byte block, making that controlled creation fit. Every byte is checked across BC7 mips, odd BC1 sRGB cube faces, padded 3D slices, rows larger than the window, 1D arrays and existing completed 32-MiB reuse. This is not the recovered Run19 descriptor, an iPhone memory measurement or a gameplay speedup.

          Important limits: later Run19 failures had destinations that could not fit even without new uploads. This candidate does not establish a sufficient safe reduction for those requests and still refuses unsafe allocations honestly. It does not claim to fix all texture errors. Resource failures preceded the renderer assertion/null read and guest C0000005 exit, but the specific failed texture producing that null object remains unproven. No exception, initialization, SRV error or GPU completion is suppressed.

          The kernel-heavy main-thread mechanism is also unresolved. The 51 contained Run19 intervals reproduce 3.041013 seconds user and 21.687596 seconds kernel CPU; writable/present external pages observed after resume are not kernel stacks. Existing backing policy, STLR/TSO settings and recovery eligibility remain unchanged. A bounded supported task-events query adds whole-host fault/page-in/COW/syscall counters, with query times and explicit scope, without touching guest pages or suspending threads.

          Export Run now receives direct shared-native request IDs, typed descriptors, upload window/charges, permit outcomes, returned HRESULTs, resource pointer values and genuine upload event/frontier where available. Rolling failures and exact app-session counters remain active after the first burst; accepted/dropped/overwritten detail stays explicit. Console occurrences, native text reports and direct requests are separate counts. The actual Run19 parsing fixture preserves 81 console OOM occurrences, eight native reports and 299 old structured rows separately. Duplicate parsing of the same source occurrence is suppressed without merging distinct repeated failures.

          Guest CS2 exit is explicit with native status and available owner/lease/PID/TID. Actual retire-v1, quarantine peb and signed/hex exit schemas are recognized, while Madeira's surviving host/unknown host termination remains separate. Existing exception/module evidence is retained without asserting a proven resource-to-null chain. Matching startup provenance survives skipped tail ingestion. Previous incomplete runs, privacy filtering, bounded journals, recorder costs, streaming ZIP/cancellation and the existing share sheet remain intact.

          Validation: normal native receipt/owner/reserve tests, actual staged upload layout/completion-adapter tests, native C/Swift recorder and Run19 parsing fixtures, incomplete recording/rotation/bounds/redaction, streaming ZIP and share behavior, TSO/recovery/retirement checks, actual iPhone SDK/native/Metal/PE/app compilation and final package checks passed. Actual iPhone recorder physical overhead and runtime thermal/CPU benefits remain unmeasured. A prior automatic legacy workflow started captured-store cases before cancellation; that violated the requested test restriction and its results are excluded. Historical fault workflows are now explicitly gated and skipped on pushes/default dispatches.

          Preserved: existing bundle com.willfaust.madeora, Steam session, installation/prefix/game/account/configuration, JIT entitlement setup, full 1152-MiB pool with 768/384 partition, code-buffer reuse, recovery/QoS correction, TSO/half-barrier, memory reserve, correct resource/GPU lifetimes, graphics/network settings, input and Export Run. No game binary/authentication/VAC change, global backing disable, MAP_PRIVATE migration, anonymous-memory expansion or graphics-settings workaround is included. Install over the existing app with the established signing workflow; do not uninstall or delete data.

          Device acceptance remains unverified: a real remote join, responsive team selection, sustained playable round, intact textures and correct return/changelevel. A build or richer ZIP is not repaired gameplay. Destination-only memory shortage and the kernel stall remain open.

          Details: https://github.com/letsdothisagainx/Madeira/blob/482ac26ffb81a2985310d64c697c61616f5134ed/docs/cs2-run19-upload-window-and-resource-evidence.md
          Normal workflow: Run CS2, encounter the problem, tap Export Run, share one ZIP. Relaunch preserves the preceding run's available evidence separately. Download Madeira.ipa below; SHA256SUMS verifies it.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title 'Madeira 482ac26f - Run19 bounded texture upload candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title 'Madeira 482ac26f - Run19 bounded texture upload candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt" --draft --prerelease
          fi
          gh release upload "$RELEASE_TAG" release-output/Madeira.ipa release-output/SHA256SUMS release-output/recovery-package.json release-output/run-evidence-package.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Verify the public download without authentication
        run: |
          public_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Madeira.ipa"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "$public_url" --output "$RUNNER_TEMP/public-Madeira.ipa"
          cmp release-output/Madeira.ipa "$RUNNER_TEMP/public-Madeira.ipa"
          printf 'Verified public IPA: %s\n' "$public_url"
          printf '## Stable IPA download\n\n[%s](%s)\n\nSource: `%s`\n\n' Madeira.ipa "$public_url" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          cat release-output/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
