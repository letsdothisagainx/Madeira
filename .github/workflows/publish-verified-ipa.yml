name: Publish verified IPA download

on:
  push:
    branches: [codex/cs2-live-memory-upload-reuse-20261116]
    paths: [.github/workflows/publish-verified-ipa.yml]
  workflow_dispatch:

# Delivery only: publish the exact successful candidate, never rebuild it or
# change the app revision. Keep write permission out of the compiler workflows.
permissions:
  actions: read
  contents: write

concurrency:
  group: publish-ipa-fed11839
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: fed1183934f481c617562e66ecbb6a75315a7553
      SOURCE_RUN: '45262074228'
      SOURCE_UUID: 9F3C8A5B-A16D-3195-955C-4AAC1268B3C6
      RELEASE_TAG: ipa-fed11839
    steps:
      - name: Require the exact successful build and artifact
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + path]))
          run = api('/actions/runs/' + os.environ['SOURCE_RUN'])
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_REVISION']
          assert run['head_repository']['full_name'].lower() == repo.lower()
          assert run['path'] == '.github/workflows/build.yml'
          artifacts = api('/actions/runs/' + os.environ['SOURCE_RUN'] + '/artifacts?name=Madeira-ipa')['artifacts']
          assert len(artifacts) == 1
          artifact = artifacts[0]
          assert artifact['name'] == 'Madeira-ipa' and not artifact['expired']
          assert str(artifact['workflow_run']['id']) == os.environ['SOURCE_RUN']
          assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_REVISION']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', artifact['digest'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SOURCE_ARTIFACT=' + str(artifact['id']) + '\n')
              env.write('ARCHIVE_SHA256=' + artifact['digest'].split(':', 1)[1] + '\n')
          tag = api('/git/ref/tags/' + os.environ['RELEASE_TAG'])
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == os.environ['SOURCE_REVISION']
          print('PASS exact successful build, source revision and immutable artifact identity')
          PY
      - uses: actions/checkout@v4
        with:
          ref: fed1183934f481c617562e66ecbb6a75315a7553
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: delivery-tools
          persist-credentials: false
      - name: Download and verify the already built IPA
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$RUNNER_TEMP/Madeira-ipa.zip"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/Madeira-ipa.zip" | sha256sum --check --strict
          mkdir release-output
          unzip -q "$RUNNER_TEMP/Madeira-ipa.zip" -d release-output
          test -s release-output/Madeira.ipa
          python3 tools/build/native-provenance.py check --root "$GITHUB_WORKSPACE" --revision "$SOURCE_REVISION" --ipa release-output/Madeira.ipa
          python3 delivery-tools/tests/host/check-store-recovery-package-inspector.py
          python3 delivery-tools/tools/check-store-recovery-package.py --ipa release-output/Madeira.ipa --revision "$SOURCE_REVISION" --require-pressure-boundary --require-recovery-scope --require-cs2-tso-profile > release-output/recovery-package.json
          cat release-output/recovery-package.json
          python3 - <<'PY'
          import json, os
          package = json.load(open('release-output/recovery-package.json'))
          assert package['bundleIdentifier'] == 'com.willfaust.madeora', 'installation identity changed'
          assert package['pressureBoundaryRequired'] is True
          assert package['recoveryScopeRequired'] is True
          assert package['cs2TSOProfileRequired'] is True
          assert package['nativeUUID'] == os.environ['SOURCE_UUID']
          print('PASS existing installation identity and compiled scoped recovery/pressure producers')
          PY
          python3 delivery-tools/tools/check-run-evidence-package.py --ipa release-output/Madeira.ipa > release-output/run-evidence-package.json
          (cd release-output && sha256sum Madeira.ipa > SHA256SUMS)
      - name: Publish the same IPA as a stable prerelease asset
        run: |
          cat > "$RUNNER_TEMP/ipa-release-notes.txt" <<'NOTES'
          Installable Madeira Run17 live-mapping/evidence candidate from source fed1183934f481c617562e66ecbb6a75315a7553.

          IPA build: https://github.com/letsdothisagainx/Madeira/actions/runs/45262074228
          Focused normal Linux/macOS and actual iPhone SDK checks: https://github.com/letsdothisagainx/Madeira/actions/runs/45262069313
          Native UUID: 9F3C8A5B-A16D-3195-955C-4AAC1268B3C6

          Run17 confirms the earlier CS2 STLR fallback was active and did not remove the kernel-heavy stall. All five highlighted effective addresses overlap one historical shared-file mapping; the export cannot establish its later live backing/protection state. No kernel diagnosis or repaired gameplay is claimed, and no backing policy, instruction selection, recovery eligibility, reserve, renderer/network setting or JIT partition is changed.

          This candidate keeps existing main/watched-worker observations rolling after the old 1200-sample limit. After the existing target resume, a nonblocking bookkeeping snapshot and bounded Mach region query preserve current allocation/extent identities, owner, guest/host protection and disposition metadata with separate timestamps and inconsistency/availability states. Fixed native records expose slow/error/in-flight map, protection, decommit, discard and punch operations without formatting or filesystem work in VM critical sections. Operation tokens are distinct from native thread lifetime IDs.

          The existing Export Run button automatically packages typed rolling history, live access metadata, frame/paging/CPU/memory/recovery progress, console-derived attempts/transitions, bounded resource-error summaries, runtime/component/module metadata and available MetricKit summaries. A previous incident run and the separately identified immediately preceding native log are preserved. Unknown termination stays unknown; console timestamps are separate from parsing time. Data missing from an observer is not synthesized as zero.

          Recording has bounded native buffers and less than 16 MiB persisted evidence per retained run. Native/Swift allocator overhead and iPhone recording cost remain unmeasured. No guest payload reads, extra capture suspension, forced faults, protection changes or kernel-stack collection are introduced. Matching symbols are a separate Madeira-native-symbols Actions artifact, referenced in package metadata. Export does not wait for system-report delivery, GPU completion or guest memory scans.

          Normal C/Swift fixtures cover actual after-resume mapping observation, busy locks/lease changes, nonblocking producer contention, rotation, identities/nulls, redaction, clocks, deduplication, incomplete-run retention, disk limits and the existing streaming ZIP/share/cancellation path. The actual iPhone SDK API type-check and final native/app packaging checks pass. No deliberate crash, protected-memory, page-revocation, fault-injection or execution of captured instructions is used.

          The full 1152 MiB JIT pool (768/384), recovery/QoS correction, code-buffer reuse, TSO correctness, memory reserve, GPU lifetimes, installed files, Steam session, prefix, input and bundle identifier are preserved. Install over the existing application using the same signing identity; do not uninstall or delete data.

          Publication verifies the source, actual native UUID/component provenance, linked recorder/consumer, immutable artifact digest and bundle identity. The unauthenticated public download is compared byte for byte with the built IPA.

          Device acceptance remains unverified: use the same remote Mirage sequence; check activation duration, main-thread user/kernel time and live mapping metadata, Present gaps, textures, responsive team selection, sustained gameplay through a round and a clean return/changelevel. Menu FPS, a build, or a richer ZIP does not prove the stall is fixed.

          Details: https://github.com/letsdothisagainx/Madeira/blob/fed1183934f481c617562e66ecbb6a75315a7553/docs/cs2-run17-live-mapping-evidence.md

          Run CS2, encounter the issue, tap Export Run, share the single ZIP. Download Madeira.ipa below; SHA256SUMS verifies the bytes.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title 'Madeira fed11839 - Run17 live mapping evidence candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title 'Madeira fed11839 - Run17 live mapping evidence candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt" --draft --prerelease
          fi
          gh release upload "$RELEASE_TAG" release-output/Madeira.ipa release-output/SHA256SUMS release-output/recovery-package.json release-output/run-evidence-package.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Verify the public download without authentication
        run: |
          public_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Madeira.ipa"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "$public_url" --output "$RUNNER_TEMP/public-Madeira.ipa"
          cmp release-output/Madeira.ipa "$RUNNER_TEMP/public-Madeira.ipa"
          printf 'Verified public IPA: %s\n' "$public_url"
          printf '## Stable IPA download\n\n[%s](%s)\n\nSource: `%s`\n\n' Madeira.ipa "$public_url" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          cat release-output/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
