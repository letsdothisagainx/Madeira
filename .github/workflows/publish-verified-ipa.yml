name: Publish verified IPA download

on:
  push:
    branches: [codex/cs2-live-memory-upload-reuse-20261116]
    paths: [.github/workflows/publish-verified-ipa.yml]
  workflow_dispatch:

# Delivery only: publish the exact successful candidate, never rebuild it or
# change the app revision. Keep write permission out of the compiler workflows.
permissions:
  actions: read
  contents: write

concurrency:
  group: publish-ipa-58b0001e
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: 58b0001e4a03f3ef9e2402188659c6a6eadc73e3
      SOURCE_RUN: '45089929298'
      SOURCE_UUID: 8EA1D7F2-C3BC-3B4F-925E-6CFA074C0A03
      RELEASE_TAG: ipa-58b0001e
    steps:
      - name: Require the exact successful build and artifact
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + path]))
          run = api('/actions/runs/' + os.environ['SOURCE_RUN'])
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_REVISION']
          assert run['head_repository']['full_name'].lower() == repo.lower()
          assert run['path'] == '.github/workflows/build.yml'
          artifacts = api('/actions/runs/' + os.environ['SOURCE_RUN'] + '/artifacts?name=Madeira-ipa')['artifacts']
          assert len(artifacts) == 1
          artifact = artifacts[0]
          assert artifact['name'] == 'Madeira-ipa' and not artifact['expired']
          assert str(artifact['workflow_run']['id']) == os.environ['SOURCE_RUN']
          assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_REVISION']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', artifact['digest'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SOURCE_ARTIFACT=' + str(artifact['id']) + '\n')
              env.write('ARCHIVE_SHA256=' + artifact['digest'].split(':', 1)[1] + '\n')
          tag = api('/git/ref/tags/' + os.environ['RELEASE_TAG'])
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == os.environ['SOURCE_REVISION']
          print('PASS exact successful build, source revision and immutable artifact identity')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 58b0001e4a03f3ef9e2402188659c6a6eadc73e3
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: delivery-tools
          persist-credentials: false
      - name: Download and verify the already built IPA
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$RUNNER_TEMP/Madeira-ipa.zip"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/Madeira-ipa.zip" | sha256sum --check --strict
          mkdir release-output
          unzip -q "$RUNNER_TEMP/Madeira-ipa.zip" -d release-output
          test -s release-output/Madeira.ipa
          python3 tools/build/native-provenance.py check --root "$GITHUB_WORKSPACE" --revision "$SOURCE_REVISION" --ipa release-output/Madeira.ipa
          python3 delivery-tools/tests/host/check-store-recovery-package-inspector.py
          python3 delivery-tools/tools/check-store-recovery-package.py --ipa release-output/Madeira.ipa --revision "$SOURCE_REVISION" --require-pressure-boundary --require-recovery-scope > release-output/recovery-package.json
          cat release-output/recovery-package.json
          python3 - <<'PY'
          import json, os
          package = json.load(open('release-output/recovery-package.json'))
          assert package['bundleIdentifier'] == 'com.willfaust.madeora', 'installation identity changed'
          assert package['pressureBoundaryRequired'] is True
          assert package['recoveryScopeRequired'] is True
          assert package['nativeUUID'] == os.environ['SOURCE_UUID']
          print('PASS existing installation identity and compiled scoped recovery/pressure producers')
          PY
          (cd release-output && sha256sum Madeira.ipa > SHA256SUMS)
      - name: Publish the same IPA as a stable prerelease asset
        run: |
          cat > "$RUNNER_TEMP/ipa-release-notes.txt" <<'NOTES'
          Installable Madeira candidate from source 58b0001e4a03f3ef9e2402188659c6a6eadc73e3.

          IPA build: https://github.com/letsdothisagainx/Madeira/actions/runs/45089929298
          Focused Linux/macOS checks: https://github.com/letsdothisagainx/Madeira/actions/runs/45089979742

          Run15 records a recovery-owned main-thread hold of 7,083,212 microseconds. This candidate moves read-only first-observation/candidate preparation outside an explicit target suspension, then captures and revalidates fresh held state before any checked write or PC publication. The recovery worker requests user-interactive QoS only while it owns a suspension, restoring its prior class and relative priority after the matching resume. Discovery remains utility. No guest suspension count is cleared or forced.

          The existing fixed-size store-progress record now attributes advisory capture/read, suspend, held capture/read, destination validation, each synchronous checked fragment write, alias accounting, state publication and resume. It records worker identity, actual QoS and API results after the resume attempt. No timer cancels a write, and the target is not resumed while a write is in flight. The seven-second baseline does not establish which phase dominates, and this patch does not guarantee an upper hold duration.

          Normal macOS tests use real Mach state capture on a live unsuspended worker, real QoS changes and checked Mach writes into writable pages. A pinned actual predecessor demonstrates two VM reads under an owned first-observation suspension; the corrected inspector performs both without acquiring one. One thousand repeated scalar/vector stores check fresh operands, exact bytes/PC, normal concurrent target progress, nested suspend ownership and QoS restoration. Existing scheduling, pressure-predicate, privacy/sanitizer and cache checks pass. The recovery-normal build compiles historical fault fixtures without executing them; no deliberate crash, protected-memory, page-revocation or fault-injection experiment is requested.

          Required texture allocation still exhausted Run15 headroom. No safely reclaimable physical owner or duplicate backing has been established; no memory saving, texture repair, complete loading fix or iPhone gameplay pass is claimed. The safety reserve and resource allocation semantics are unchanged.

          The full 1,152 MiB JIT pool and 768/384 MiB partition, code-buffer reuse, checked-store recovery, physical safety reserve, GPU completion/resource lifetimes, Steam authentication, networking and existing input behavior are preserved. The existing bundle identifier, Wine prefix, game files, Steam setup and user configuration are retained. Install over the existing app with the same signing identity; do not uninstall or delete its data.

          The artifact's source revision, native provenance and immutable archive digest are checked before publication. recovery-package.json verifies the compiled discovery path, scoped-recovery/phase markers, linked timed checked-write helper, and preserved pressure callback. Publication copies the built IPA without rebuilding it, then compares an unauthenticated public download byte for byte.

          Device acceptance remains responsive remote team selection, sustained gameplay through a round and a clean menu/map transition without failed required textures. Build and host checks do not establish those outcomes.

          Detailed analysis: https://github.com/letsdothisagainx/Madeira/blob/58b0001e4a03f3ef9e2402188659c6a6eadc73e3/docs/run15-recovery-hold-20261123.md

          Download Madeira.ipa below. SHA256SUMS verifies its bytes.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title 'Madeira 58b0001e - Run15 recovery-scope candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title 'Madeira 58b0001e - Run15 recovery-scope candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt" --draft --prerelease
          fi
          gh release upload "$RELEASE_TAG" release-output/Madeira.ipa release-output/SHA256SUMS release-output/recovery-package.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Verify the public download without authentication
        run: |
          public_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Madeira.ipa"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "$public_url" --output "$RUNNER_TEMP/public-Madeira.ipa"
          cmp release-output/Madeira.ipa "$RUNNER_TEMP/public-Madeira.ipa"
          printf 'Verified public IPA: %s\n' "$public_url"
          printf '## Stable IPA download\n\n[%s](%s)\n\nSource: `%s`\n\n' Madeira.ipa "$public_url" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          cat release-output/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
