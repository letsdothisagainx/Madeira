name: Publish verified IPA download

on:
  push:
    branches: [codex/cs2-live-memory-upload-reuse-20261116]
    paths: [.github/workflows/publish-verified-ipa.yml]
  workflow_dispatch:

# Delivery only: publish the exact successful candidate, never rebuild it or
# change the app revision. Keep write permission out of the compiler workflows.
permissions:
  actions: read
  contents: write

concurrency:
  group: publish-ipa-949e7332
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: 949e7332e015d712f9408230ebb66dce4d3f12c0
      SOURCE_RUN: '45485893297'
      SOURCE_UUID: 2CEE3A9D-A765-329B-8F7C-CF10DB6FDE94
      RELEASE_TAG: ipa-949e7332
    steps:
      - name: Require the exact successful build and artifact
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + path]))
          run = api('/actions/runs/' + os.environ['SOURCE_RUN'])
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_REVISION']
          assert run['head_repository']['full_name'].lower() == repo.lower()
          assert run['path'] == '.github/workflows/build.yml'
          artifacts = api('/actions/runs/' + os.environ['SOURCE_RUN'] + '/artifacts?name=Madeira-ipa')['artifacts']
          assert len(artifacts) == 1
          artifact = artifacts[0]
          assert artifact['name'] == 'Madeira-ipa' and not artifact['expired']
          assert str(artifact['workflow_run']['id']) == os.environ['SOURCE_RUN']
          assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_REVISION']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', artifact['digest'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SOURCE_ARTIFACT=' + str(artifact['id']) + '\n')
              env.write('ARCHIVE_SHA256=' + artifact['digest'].split(':', 1)[1] + '\n')
          tag = api('/git/ref/tags/' + os.environ['RELEASE_TAG'])
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == os.environ['SOURCE_REVISION']
          print('PASS exact successful build, source revision and immutable artifact identity')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 949e7332e015d712f9408230ebb66dce4d3f12c0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: delivery-tools
          persist-credentials: false
      - name: Download and verify the already built IPA
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$RUNNER_TEMP/Madeira-ipa.zip"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/Madeira-ipa.zip" | sha256sum --check --strict
          mkdir release-output
          unzip -q "$RUNNER_TEMP/Madeira-ipa.zip" -d release-output
          test -s release-output/Madeira.ipa
          python3 tools/build/native-provenance.py check --root "$GITHUB_WORKSPACE" --revision "$SOURCE_REVISION" --ipa release-output/Madeira.ipa
          python3 delivery-tools/tests/host/check-store-recovery-package-inspector.py
          python3 delivery-tools/tools/check-store-recovery-package.py --ipa release-output/Madeira.ipa --revision "$SOURCE_REVISION" --require-pressure-boundary --require-recovery-scope --require-cs2-tso-profile > release-output/recovery-package.json
          cat release-output/recovery-package.json
          python3 - <<'PY'
          import json, os
          package = json.load(open('release-output/recovery-package.json'))
          assert package['bundleIdentifier'] == 'com.willfaust.madeora', 'installation identity changed'
          assert package['pressureBoundaryRequired'] is True
          assert package['recoveryScopeRequired'] is True
          assert package['cs2TSOProfileRequired'] is True
          assert package['nativeUUID'] == os.environ['SOURCE_UUID']
          print('PASS existing installation identity and compiled scoped recovery/pressure producers')
          PY
          python3 delivery-tools/tools/check-run-evidence-package.py --ipa release-output/Madeira.ipa > release-output/run-evidence-package.json
          (cd release-output && sha256sum Madeira.ipa > SHA256SUMS)
      - name: Publish the same IPA as a stable prerelease asset
        run: |
          cat > "$RUNNER_TEMP/ipa-release-notes.txt" <<'NOTES'
          Madeira Run22 attribution candidate. The reproduced kernel-heavy remote gameplay stall is NOT established as repaired.

          App source: 949e7332e015d712f9408230ebb66dce4d3f12c0
          Native UUID: 2CEE3A9D-A765-329B-8F7C-CF10DB6FDE94
          IPA SHA256: d2459ce0395410714510b2b2f4b45483cf91da2a283b721344fc01f545bcdab5
          IPA build: https://github.com/letsdothisagainx/Madeira/actions/runs/45485893297
          Normal Linux/macOS/iPhone SDK checks: https://github.com/letsdothisagainx/Madeira/actions/runs/45485898586
          Matching symbols: Madeira-native-symbols:45485893297

          Run22 successfully cleared Steam's response and launched CS2, then reproduced a failed remote session with 65 complete main-thread intervals: 76.915693 seconds elapsed, 2.961694 user CPU and 30.587423 kernel CPU. Direct resource counters had 27996 non-failure results without an allocation-failure burst. Post-resume external mappings and host-wide paging/I/O still do not identify the expensive kernel operation.

          This candidate adds passive per-main lifetime counters for Wine server calls, select waits, uninterrupted-mutex acquisition and explicit VM operations. Inclusive elapsed times are separate from CPU and cannot be summed across nested classes. Existing one-second samples resolve generated PCs through a 256-entry bounded checked metadata lookup after resume; cached module/RVA age and unavailable outcomes are explicit. No additional suspension, guest payload read, instruction change, protection change or new recovery eligibility is introduced.

          Export Run retains a separate 256-KiB first post-activation stall window alongside the existing failure lanes and recent incidents, within the existing 16-MiB run cap. Controller discovery/lifecycle records distinguish framework enumeration, supported profiles, cached state and actual timer activation; no input bindings, focus gate or queue policy is changed. Known graphics-loader errors can retain an opaque resource-path identifier and error class without disclosing private paths or claiming required-resource status.

          Ordinary host fixtures pass counter identity/lease/nesting/concurrency/errno, exact resolver metadata and budget exhaustion, first-window durability, failure retention, privacy, clock handling, prior-run separation, source freshness, actual ZIP/cancellation/share behavior, input ordering/lifecycle and upload/fence/reserve contracts. CI verifies iPhone SDK source, native/Metal/PE packaging and linked producers/consumers. No deliberate crash, fault injection, protected-memory experiment or captured instruction execution was performed. Local counter cost is approximately 4 ns disabled and 61 ns registered per pair on Linux; iPhone overhead is unmeasured and lookup duration is recorded per sample.

          Remaining: the exact main-thread kernel operation is unresolved. No source-backed large safe memory reclamation was established for the older destination-only shortage. Controller movement/aim/buttons and visual correctness remain unverified. Build/test success does not establish responsive team selection or a sustained playable remote round. This is an attribution candidate, not a gameplay-success claim.

          Preserved: bundle com.willfaust.madeora, installation/prefix/game/account/configuration, Steam session and launch handoff, source freshness, bounded input queue, failure retention, JIT entitlements, 1152-MiB pool with 768/384 partition, code-buffer reuse, recovery/QoS, STLR/TSO/half-barrier, memory safeguards and GPU lifetimes. No backing policy, graphics setting or network timeout change. Install over the existing app using the established signing workflow; do not uninstall or delete data.

          Details: https://github.com/letsdothisagainx/Madeira/blob/949e7332e015d712f9408230ebb66dce4d3f12c0/docs/cs2-run22-main-runtime-attribution.md
          Normal workflow: Run CS2, encounter the problem, tap Export Run, share one ZIP. Download Madeira.ipa below; SHA256SUMS verifies it.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title 'Madeira 949e7332 - Run22 main-thread attribution candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title 'Madeira 949e7332 - Run22 main-thread attribution candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt" --draft --prerelease
          fi
          gh release upload "$RELEASE_TAG" release-output/Madeira.ipa release-output/SHA256SUMS release-output/recovery-package.json release-output/run-evidence-package.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Verify the public download without authentication
        run: |
          public_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Madeira.ipa"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "$public_url" --output "$RUNNER_TEMP/public-Madeira.ipa"
          cmp release-output/Madeira.ipa "$RUNNER_TEMP/public-Madeira.ipa"
          printf 'Verified public IPA: %s\n' "$public_url"
          printf '## Stable IPA download\n\n[%s](%s)\n\nSource: `%s`\n\n' Madeira.ipa "$public_url" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          cat release-output/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
