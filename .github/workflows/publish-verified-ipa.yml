name: Publish verified IPA download

on:
  push:
    branches: [codex/cs2-live-memory-upload-reuse-20261116]
    paths: [.github/workflows/publish-verified-ipa.yml]
  workflow_dispatch:

# Delivery only: publish the exact successful candidate, never rebuild it or
# change the app revision. Keep write permission out of the compiler workflows.
permissions:
  actions: read
  contents: write

concurrency:
  group: publish-ipa-06a93b3c
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: 06a93b3c81460e63c3da7d9b7b1e39b088318fec
      SOURCE_RUN: '45371400389'
      SOURCE_UUID: 1E19AE26-0CEE-3E28-AF0F-35A1267D838B
      RELEASE_TAG: ipa-06a93b3c
    steps:
      - name: Require the exact successful build and artifact
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + path]))
          run = api('/actions/runs/' + os.environ['SOURCE_RUN'])
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_REVISION']
          assert run['head_repository']['full_name'].lower() == repo.lower()
          assert run['path'] == '.github/workflows/build.yml'
          artifacts = api('/actions/runs/' + os.environ['SOURCE_RUN'] + '/artifacts?name=Madeira-ipa')['artifacts']
          assert len(artifacts) == 1
          artifact = artifacts[0]
          assert artifact['name'] == 'Madeira-ipa' and not artifact['expired']
          assert str(artifact['workflow_run']['id']) == os.environ['SOURCE_RUN']
          assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_REVISION']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', artifact['digest'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SOURCE_ARTIFACT=' + str(artifact['id']) + '\n')
              env.write('ARCHIVE_SHA256=' + artifact['digest'].split(':', 1)[1] + '\n')
          tag = api('/git/ref/tags/' + os.environ['RELEASE_TAG'])
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == os.environ['SOURCE_REVISION']
          print('PASS exact successful build, source revision and immutable artifact identity')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 06a93b3c81460e63c3da7d9b7b1e39b088318fec
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: delivery-tools
          persist-credentials: false
      - name: Download and verify the already built IPA
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$RUNNER_TEMP/Madeira-ipa.zip"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/Madeira-ipa.zip" | sha256sum --check --strict
          mkdir release-output
          unzip -q "$RUNNER_TEMP/Madeira-ipa.zip" -d release-output
          test -s release-output/Madeira.ipa
          python3 tools/build/native-provenance.py check --root "$GITHUB_WORKSPACE" --revision "$SOURCE_REVISION" --ipa release-output/Madeira.ipa
          python3 delivery-tools/tests/host/check-store-recovery-package-inspector.py
          python3 delivery-tools/tools/check-store-recovery-package.py --ipa release-output/Madeira.ipa --revision "$SOURCE_REVISION" --require-pressure-boundary --require-recovery-scope --require-cs2-tso-profile > release-output/recovery-package.json
          cat release-output/recovery-package.json
          python3 - <<'PY'
          import json, os
          package = json.load(open('release-output/recovery-package.json'))
          assert package['bundleIdentifier'] == 'com.willfaust.madeora', 'installation identity changed'
          assert package['pressureBoundaryRequired'] is True
          assert package['recoveryScopeRequired'] is True
          assert package['cs2TSOProfileRequired'] is True
          assert package['nativeUUID'] == os.environ['SOURCE_UUID']
          print('PASS existing installation identity and compiled scoped recovery/pressure producers')
          PY
          python3 delivery-tools/tools/check-run-evidence-package.py --ipa release-output/Madeira.ipa > release-output/run-evidence-package.json
          (cd release-output && sha256sum Madeira.ipa > SHA256SUMS)
      - name: Publish the same IPA as a stable prerelease asset
        run: |
          cat > "$RUNNER_TEMP/ipa-release-notes.txt" <<'NOTES'
          Installable Madeira Run20 candidate: bounded controller delivery, less repeated initializer work, and retained failed-resource evidence.

          App source: 06a93b3c81460e63c3da7d9b7b1e39b088318fec
          Native UUID: 1E19AE26-0CEE-3E28-AF0F-35A1267D838B
          IPA SHA256: 8074054e5524abc865aa6785e5518a7a7fe8a7c68f05f71764cfbb172dfa47ba
          IPA build: https://github.com/letsdothisagainx/Madeira/actions/runs/45371400389
          Normal Linux/macOS/iPhone SDK checks: https://github.com/letsdothisagainx/Madeira/actions/runs/45371405404
          Matching symbols: Madeira-native-symbols:45371400389

          The actual old input queue silently rejected an incoming key release after 255 motion entries. The replacement retains the same capacity, coalesces only adjacent compatible pure motion, preserves transition ordering, limits motion history, and bounds each drain turn. Overflow is explicit and counted: motion is discarded first; an edge-only overflow schedules neutralization of bridge-submitted holds and discards stale pending history. Producers never wait for the consumer. Per-motion logging and flushes on the Wine event thread are removed.

          The old keyboard/mouse pad translator posted buttons and key-stick presses even with focused=false. The corrected path gates all output, releases held controls, requires neutral controls after focus/lifecycle loss, preserves custom bindings, and resynchronizes current valid states after queue resets. App/library/session changes invalidate stale queued input. Existing foreground restoration and dialog protections remain; no indiscriminate focus stealing is added. Queue saturation or a wrong foreground recipient was not established in Run20, so these are corrections of reproduced source weaknesses, not proof of the phone failure's complete cause.

          The real texture credit handoff now supplies its already observed initializer fence to the diagnostic observer. An actual staged helper fixture reproduces two baseline fence queries versus one corrected query, with the same handoff frontier. Genuine GPU-completion ownership, upload bytes/layout/window, allocation credits and reserve remain unchanged. This removes repeated initializer maintenance, but does not establish a fix for the earlier kernel-heavy stall.

          Export Run records physical/controller mode/binding state, translation/enqueue/coalesce/drop/age/drain counters, injection results, actual wineserver route target and available process lease, plus limited input-window-procedure-return evidence. No typed text or passwords are captured. Accepted injection and a procedure return do not prove a game action or responsive input. Busy/recycled identities stay unavailable. No extra diagnostic Windows query/IPC, guest payload read or suspension loop is added.

          Native recording reserves first 32 + latest 96 failed request details, separately from routine traffic, with dropped/overwritten counts. Swift reserves a rolling failure journal and first-detail file; routine successes/reclamation are aggregated. A first important incident and recent/terminal incident have independent bounded budgets, so later ordinary frame stalls cannot erase resource-failure evidence. The real ZIP includes the new failure/input files and separately identified preceding run. Structured capture cutoffs remain distinct from raw logs that continued during export. The exact vote-kick reason is preserved rather than relabelled as a timeout.

          Normal fixtures reproduce the old lost-release and unfocused-button defects, and pass corrected input ordering/coalescing/overflow/age/lifecycle/custom-binding checks, actual server routing/lease metadata, and fixed storage bounds. The native failure lane retains first 32 + latest 96 of 222 requests under 6216 routine records and counts 94 overwritten details. Swift preserves 222 distinct requests through 11119 routine observations and later stalls; the 6119 reclamations plus 5000 successes cause zero individual logical writes before aggregate checkpoint. Run20 console occurrences, native text reports and old successful structured results remain separate. Existing upload owned-byte/completion, reserve, retirement, recovery/TSO, recorder bounds/redaction/prior-run, streaming ZIP/cancellation/share and iPhone SDK/native/Metal/PE/package checks passed. These are host/build results. Device overhead, thermal benefits and actual gameplay performance are unmeasured. No deliberate crash/fault/protected-memory/page-revocation experiment or captured instruction execution is used.

          Important limits: Run20's early slowdown precedes the allocation burst and controller connection. The calibrated 91 complete main intervals reproduce 3.733065 seconds user and 38.491615 seconds kernel CPU (91.159% of consumed CPU), but existing observations do not identify the expensive kernel operation. Destination-only texture shortages remain: the example 1-MiB destination exceeds the available 869912-byte window even before upload storage. The live-owner/capacity evidence does not establish sufficient safely reclaimable physical storage. This candidate does not claim those shortages, visual corruption, sustained FPS or usable remote gameplay are repaired. It does not remove the reserve or force-free live/quarantined mappings.

          Preserved: bundle com.willfaust.madeora, installation/prefix/game/account/configuration, Steam session, JIT entitlement setup, 1152-MiB pool with 768/384 partition, code-buffer reuse, recovery/QoS, STLR/TSO/half-barrier, memory safeguards and GPU resource lifetimes. Graphics/network timeout settings, genuine authentication and Valve binaries are unchanged. Install over the existing app using the established signing workflow; do not uninstall or delete data.

          Device acceptance remains unverified: responsive controller movement/aim/buttons through a sustained remote round, no prolonged frame stalls or resource-failure termination, intact textures and a correct return/changelevel. Reaching a live view or publishing this IPA is not that acceptance.

          Details: https://github.com/letsdothisagainx/Madeira/blob/06a93b3c81460e63c3da7d9b7b1e39b088318fec/docs/cs2-run20-input-and-failure-retention.md
          Normal workflow: Run CS2, encounter the problem, tap Export Run, share one ZIP. Relaunch preserves the preceding run's available evidence separately. Download Madeira.ipa below; SHA256SUMS verifies it.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title 'Madeira 06a93b3c - Run20 input and resource evidence candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title 'Madeira 06a93b3c - Run20 input and resource evidence candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt" --draft --prerelease
          fi
          gh release upload "$RELEASE_TAG" release-output/Madeira.ipa release-output/SHA256SUMS release-output/recovery-package.json release-output/run-evidence-package.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Verify the public download without authentication
        run: |
          public_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Madeira.ipa"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "$public_url" --output "$RUNNER_TEMP/public-Madeira.ipa"
          cmp release-output/Madeira.ipa "$RUNNER_TEMP/public-Madeira.ipa"
          printf 'Verified public IPA: %s\n' "$public_url"
          printf '## Stable IPA download\n\n[%s](%s)\n\nSource: `%s`\n\n' Madeira.ipa "$public_url" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          cat release-output/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
