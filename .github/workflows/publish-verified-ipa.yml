name: Publish verified IPA download

on:
  push:
    branches: [codex/cs2-live-memory-upload-reuse-20261116]
    paths: [.github/workflows/publish-verified-ipa.yml]
  workflow_dispatch:

# Delivery only: publish the exact successful candidate, never rebuild it or
# change the app revision. Keep write permission out of the compiler workflows.
permissions:
  actions: read
  contents: write

concurrency:
  group: publish-ipa-08c333ba
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: 08c333bae081862256d73d0d4b388ceea9fa1db7
      SOURCE_RUN: '44815121124'
      RELEASE_TAG: ipa-08c333ba
    steps:
      - name: Require the exact successful build and artifact
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + path]))
          run = api('/actions/runs/' + os.environ['SOURCE_RUN'])
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_REVISION']
          assert run['head_repository']['full_name'].lower() == repo.lower()
          assert run['path'] == '.github/workflows/build.yml'
          artifacts = api('/actions/runs/' + os.environ['SOURCE_RUN'] + '/artifacts?name=Madeira-ipa')['artifacts']
          assert len(artifacts) == 1
          artifact = artifacts[0]
          assert artifact['name'] == 'Madeira-ipa' and not artifact['expired']
          assert str(artifact['workflow_run']['id']) == os.environ['SOURCE_RUN']
          assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_REVISION']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', artifact['digest'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SOURCE_ARTIFACT=' + str(artifact['id']) + '\n')
              env.write('ARCHIVE_SHA256=' + artifact['digest'].split(':', 1)[1] + '\n')
          tag = api('/git/ref/tags/' + os.environ['RELEASE_TAG'])
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == os.environ['SOURCE_REVISION']
          print('PASS exact successful build, source revision and immutable artifact identity')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 08c333bae081862256d73d0d4b388ceea9fa1db7
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: delivery-tools
          persist-credentials: false
      - name: Download and verify the already built IPA
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$RUNNER_TEMP/Madeira-ipa.zip"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/Madeira-ipa.zip" | sha256sum --check --strict
          mkdir release-output
          unzip -q "$RUNNER_TEMP/Madeira-ipa.zip" -d release-output
          test -s release-output/Madeira.ipa
          python3 tools/build/native-provenance.py check --root "$GITHUB_WORKSPACE" --revision "$SOURCE_REVISION" --ipa release-output/Madeira.ipa
          python3 delivery-tools/tests/host/check-store-recovery-package-inspector.py
          python3 delivery-tools/tools/check-store-recovery-package.py --ipa release-output/Madeira.ipa --revision "$SOURCE_REVISION" > release-output/recovery-package.json
          cat release-output/recovery-package.json
          (cd release-output && sha256sum Madeira.ipa > SHA256SUMS)
      - name: Publish the same IPA as a stable prerelease asset
        run: |
          cat > "$RUNNER_TEMP/ipa-release-notes.txt" <<'NOTES'
          Madeira IPA from source 08c333bae081862256d73d0d4b388ceea9fa1db7.

          IPA build: https://github.com/letsdothisagainx/Madeira/actions/runs/44815121124
          Focused Linux/macOS checks: https://github.com/letsdothisagainx/Madeira/actions/runs/44815126723

          This candidate corrects a source-confirmed scheduling defect in the existing checked-store recovery worker. A long full-task discovery scan could consume its entire 100-ms period, become immediately overdue again, and delay follow-up of already watched copy threads. Discovery now services those targets between native queries and schedules the next full scan from a fresh completion timestamp. The existing eligibility checks, two-observation confirmation, checked fragment writes, PC publication, native identity ownership, eight-slot bound and suspension balancing remain active.

          A normal-success replay of the actual production bodies completes 19 additional real-byte stores by 500 modeled ms, compared with 2,910 ms before; maximum target capture gap is 25 rather than 145 ms. All native APIs succeed and all destinations are writable. This is a controlled scheduler result, not a measured iPhone map-loading speedup. No deliberate crash, protected-neighbor, revocation or fault-injection experiment was run for this candidate.

          The IPA workflow selects the explicit recovery-normal validation profile to honor that constraint. Its six targeted host checks and normal native/source/ABI/topology/package verification run; the full historical fault-testing suite is not claimed. Complete IPA reuse is separated by validation profile.

          Bounded observations cover the actual accepted CS2 main native thread and at most two already observed copy workers. They retain current host execution, wait/CPU state and recovery results where Run13 lacked continuous attribution. No Valve binary, game protocol, authentication, memory reserve, JIT partition or renderer policy is patched.

          The full 1,152 MiB JIT pool, larger code-buffer reuse, checked-store protections, topology, GPU resource ownership, installation bundle identity, Steam setup, Wine prefix and user configuration are preserved.

          recovery-package.json records the packaged native UUID and read-only inspection of the compiled discovery-to-hot-service path and post-discovery clock call. The source/provenance and immutable Actions artifact digest are verified before publication. This release uploads the same built IPA without recompilation.

          The contribution of this scheduler defect to Run13's 103-second activation and later timeout is not independently measured. Responsive team selection, continuing remote gameplay through a round, and intact rendering after return/changelevel still require an iPhone session. A passing build or menu FPS is not device acceptance.

          Detailed analysis: https://github.com/letsdothisagainx/Madeira/blob/08c333bae081862256d73d0d4b388ceea9fa1db7/docs/cs2-run13-critical-path-20261120.md

          Download Madeira.ipa below. SHA256SUMS verifies its bytes.
          NOTES
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title 'Madeira 08c333ba - store recovery scheduling' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt" --draft --prerelease
          gh release upload "$RELEASE_TAG" release-output/Madeira.ipa release-output/SHA256SUMS release-output/recovery-package.json --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Verify the public download without authentication
        run: |
          public_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Madeira.ipa"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "$public_url" --output "$RUNNER_TEMP/public-Madeira.ipa"
          cmp release-output/Madeira.ipa "$RUNNER_TEMP/public-Madeira.ipa"
          printf 'Verified public IPA: %s\n' "$public_url"
          printf '## Stable IPA download\n\n[%s](%s)\n\nSource: `%s`\n\n' Madeira.ipa "$public_url" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          cat release-output/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
