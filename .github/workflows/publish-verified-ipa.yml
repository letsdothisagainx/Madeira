name: Publish verified IPA download

on:
  push:
    branches: [codex/cs2-live-memory-upload-reuse-20261116]
    paths: [.github/workflows/publish-verified-ipa.yml]
  workflow_dispatch:

# Delivery only: publish the exact successful candidate, never rebuild it or
# change the app revision. Keep write permission out of the compiler workflows.
permissions:
  actions: read
  contents: write

concurrency:
  group: publish-ipa-90ec5b64
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: 90ec5b64cb3048c25055281e612257131db450d9
      SOURCE_RUN: '45098761826'
      SOURCE_UUID: 12241A2B-D7F0-3253-BF69-B81E5ECBF19F
      RELEASE_TAG: ipa-90ec5b64
    steps:
      - name: Require the exact successful build and artifact
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + path]))
          run = api('/actions/runs/' + os.environ['SOURCE_RUN'])
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_REVISION']
          assert run['head_repository']['full_name'].lower() == repo.lower()
          assert run['path'] == '.github/workflows/build.yml'
          artifacts = api('/actions/runs/' + os.environ['SOURCE_RUN'] + '/artifacts?name=Madeira-ipa')['artifacts']
          assert len(artifacts) == 1
          artifact = artifacts[0]
          assert artifact['name'] == 'Madeira-ipa' and not artifact['expired']
          assert str(artifact['workflow_run']['id']) == os.environ['SOURCE_RUN']
          assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_REVISION']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', artifact['digest'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SOURCE_ARTIFACT=' + str(artifact['id']) + '\n')
              env.write('ARCHIVE_SHA256=' + artifact['digest'].split(':', 1)[1] + '\n')
          tag = api('/git/ref/tags/' + os.environ['RELEASE_TAG'])
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == os.environ['SOURCE_REVISION']
          print('PASS exact successful build, source revision and immutable artifact identity')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 90ec5b64cb3048c25055281e612257131db450d9
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: delivery-tools
          persist-credentials: false
      - name: Download and verify the already built IPA
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$RUNNER_TEMP/Madeira-ipa.zip"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/Madeira-ipa.zip" | sha256sum --check --strict
          mkdir release-output
          unzip -q "$RUNNER_TEMP/Madeira-ipa.zip" -d release-output
          test -s release-output/Madeira.ipa
          python3 tools/build/native-provenance.py check --root "$GITHUB_WORKSPACE" --revision "$SOURCE_REVISION" --ipa release-output/Madeira.ipa
          python3 delivery-tools/tests/host/check-store-recovery-package-inspector.py
          python3 delivery-tools/tools/check-store-recovery-package.py --ipa release-output/Madeira.ipa --revision "$SOURCE_REVISION" --require-pressure-boundary --require-recovery-scope --require-cs2-tso-profile > release-output/recovery-package.json
          cat release-output/recovery-package.json
          python3 - <<'PY'
          import json, os
          package = json.load(open('release-output/recovery-package.json'))
          assert package['bundleIdentifier'] == 'com.willfaust.madeora', 'installation identity changed'
          assert package['pressureBoundaryRequired'] is True
          assert package['recoveryScopeRequired'] is True
          assert package['cs2TSOProfileRequired'] is True
          assert package['nativeUUID'] == os.environ['SOURCE_UUID']
          print('PASS existing installation identity and compiled scoped recovery/pressure producers')
          PY
          (cd release-output && sha256sum Madeira.ipa > SHA256SUMS)
      - name: Publish the same IPA as a stable prerelease asset
        run: |
          cat > "$RUNNER_TEMP/ipa-release-notes.txt" <<'NOTES'
          Installable Madeira Run16 instruction-path candidate from source 90ec5b64cb3048c25055281e612257131db450d9.

          IPA build: https://github.com/letsdothisagainx/Madeira/actions/runs/45098761826
          Focused Linux/macOS checks: https://github.com/letsdothisagainx/Madeira/actions/runs/45098595719

          CS2 alone merges disablelrcpc2 into its initialized FEX configuration before host-feature selection and creation of its JIT context. Only the conflicting enablelrcpc2 bit is removed; unrelated overrides, TSO and half-barrier settings remain intact. Steam and other executable contexts keep their existing feature selection. No host-wide environment variable is changed and no AppConfig JSON lookup is required.

          The initializer now owns the executable basename: the prior string_view referred to a temporary full-path string. This establishes a valid name throughout configuration loading and the process-specific match. CS2 starts a fresh translation context and its experimental persistent-code-cache path is gated off; no installed files, account data or caches are deleted.

          Normal host validation executes the staged profile, pinned CPUFeatures selection, the actual scalar StoreMemTSO body and real FEX CodeEmitter headers. It reports LRCPC2=false, tso=true and halfbar=true for CS2, verifies unaffected other guests and emits fresh ARM64 STLR bytes. Captured baseline 99000356/d90000d3 becomes 889fff56/c89ffcd3, with the existing NOP slots retained. Those bytes are inspected rather than executed; no protected-memory, page-revocation or deliberate crash/fault experiment is requested.

          This is an instruction-path hypothesis, not a demonstrated iOS kernel diagnosis or a playable-gameplay claim. The tested archive had short sampled recovery holds but kernel-heavy aligned stores and a remote timeout. The new actual CS2/iPhone runtime feature record, frame times and networking outcome still need to be observed after installation.

          The Run15 recovery/QoS correction, physical reserve, resource lifetimes, graphics and networking timeouts remain intact. The full 1,152 MiB JIT pool and 768/384 MiB partition, existing code-buffer reuse, FEX revision, bundle identifier, Wine prefix, game files, Steam session and configuration are preserved. Install over the existing app with the same signing identity; do not uninstall or delete its data.

          Publication verifies the actual built IPA source/native provenance, native UUID, immutable artifact digest, bundle identity, compiled recovery producer, and the new policy marker in the real ARM64EC FEX hybrid module. Its CPU SHA256 is recorded in recovery-package.json. An unauthenticated public download is compared byte for byte with the built IPA.

          Device comparison: use the same Mirage sequence. Assess connection-to-activation, post-activation main-thread user/kernel time, Present gaps, texture errors, responsive team selection and a sustained round without disconnecting. If kernel-heavy stalls persist despite confirmed fallback, investigate backing/mapping next instead of changing recovery polling. No texture-memory repair is inferred from this run's zero logged allocation errors.

          Details: https://github.com/letsdothisagainx/Madeira/blob/90ec5b64cb3048c25055281e612257131db450d9/docs/run16-cs2-stlr-candidate-20261123.md

          Download Madeira.ipa below. SHA256SUMS verifies its bytes.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title 'Madeira 90ec5b64 - Run16 CS2 STLR candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title 'Madeira 90ec5b64 - Run16 CS2 STLR candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt" --draft --prerelease
          fi
          gh release upload "$RELEASE_TAG" release-output/Madeira.ipa release-output/SHA256SUMS release-output/recovery-package.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Verify the public download without authentication
        run: |
          public_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Madeira.ipa"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "$public_url" --output "$RUNNER_TEMP/public-Madeira.ipa"
          cmp release-output/Madeira.ipa "$RUNNER_TEMP/public-Madeira.ipa"
          printf 'Verified public IPA: %s\n' "$public_url"
          printf '## Stable IPA download\n\n[%s](%s)\n\nSource: `%s`\n\n' Madeira.ipa "$public_url" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          cat release-output/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
