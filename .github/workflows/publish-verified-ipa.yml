name: Publish verified IPA download

on:
  push:
    branches: [codex/cs2-live-memory-upload-reuse-20261116]
    paths: [.github/workflows/publish-verified-ipa.yml]
  workflow_dispatch:

# Delivery only: publish the exact successful candidate, never rebuild it or
# change the app revision. Keep write permission out of the compiler workflows.
permissions:
  actions: read
  contents: write

concurrency:
  group: publish-ipa-8a360afe
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: 8a360afef38b82a3b84a1eaca73826d583b0d52e
      SOURCE_RUN: '45430544515'
      SOURCE_UUID: F816138C-82A2-3D2F-B9D6-75D26F5FE9A4
      RELEASE_TAG: ipa-8a360afe
    steps:
      - name: Require the exact successful build and artifact
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + path]))
          run = api('/actions/runs/' + os.environ['SOURCE_RUN'])
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_REVISION']
          assert run['head_repository']['full_name'].lower() == repo.lower()
          assert run['path'] == '.github/workflows/build.yml'
          artifacts = api('/actions/runs/' + os.environ['SOURCE_RUN'] + '/artifacts?name=Madeira-ipa')['artifacts']
          assert len(artifacts) == 1
          artifact = artifacts[0]
          assert artifact['name'] == 'Madeira-ipa' and not artifact['expired']
          assert str(artifact['workflow_run']['id']) == os.environ['SOURCE_RUN']
          assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_REVISION']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', artifact['digest'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SOURCE_ARTIFACT=' + str(artifact['id']) + '\n')
              env.write('ARCHIVE_SHA256=' + artifact['digest'].split(':', 1)[1] + '\n')
          tag = api('/git/ref/tags/' + os.environ['RELEASE_TAG'])
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == os.environ['SOURCE_REVISION']
          print('PASS exact successful build, source revision and immutable artifact identity')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 8a360afef38b82a3b84a1eaca73826d583b0d52e
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: delivery-tools
          persist-credentials: false
      - name: Download and verify the already built IPA
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$RUNNER_TEMP/Madeira-ipa.zip"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/Madeira-ipa.zip" | sha256sum --check --strict
          mkdir release-output
          unzip -q "$RUNNER_TEMP/Madeira-ipa.zip" -d release-output
          test -s release-output/Madeira.ipa
          python3 tools/build/native-provenance.py check --root "$GITHUB_WORKSPACE" --revision "$SOURCE_REVISION" --ipa release-output/Madeira.ipa
          python3 delivery-tools/tests/host/check-store-recovery-package-inspector.py
          python3 delivery-tools/tools/check-store-recovery-package.py --ipa release-output/Madeira.ipa --revision "$SOURCE_REVISION" --require-pressure-boundary --require-recovery-scope --require-cs2-tso-profile > release-output/recovery-package.json
          cat release-output/recovery-package.json
          python3 - <<'PY'
          import json, os
          package = json.load(open('release-output/recovery-package.json'))
          assert package['bundleIdentifier'] == 'com.willfaust.madeora', 'installation identity changed'
          assert package['pressureBoundaryRequired'] is True
          assert package['recoveryScopeRequired'] is True
          assert package['cs2TSOProfileRequired'] is True
          assert package['nativeUUID'] == os.environ['SOURCE_UUID']
          print('PASS existing installation identity and compiled scoped recovery/pressure producers')
          PY
          python3 delivery-tools/tools/check-run-evidence-package.py --ipa release-output/Madeira.ipa > release-output/run-evidence-package.json
          (cd release-output && sha256sum Madeira.ipa > SHA256SUMS)
      - name: Publish the same IPA as a stable prerelease asset
        run: |
          cat > "$RUNNER_TEMP/ipa-release-notes.txt" <<'NOTES'
          Installable Madeira Run21 candidate: reveal Steam's pending interaction and distinguish current launch evidence from historical gameplay logs.

          App source: 8a360afef38b82a3b84a1eaca73826d583b0d52e
          Native UUID: F816138C-82A2-3D2F-B9D6-75D26F5FE9A4
          IPA SHA256: 49273b0f72186283b8a64f6abccb98446c7031acdeb8aa30880154c071fcc9cd
          IPA build: https://github.com/letsdothisagainx/Madeira/actions/runs/45430544515
          Normal Linux/macOS/iPhone SDK checks: https://github.com/letsdothisagainx/Madeira/actions/runs/45430615827
          Matching symbols: Madeira-native-symbols:45430544515

          The current Steam action explicitly waits for a user response to ShowInterstitials. Its prompt subtype is unknown. Madeira now retains the requested AppID separately from the transient Steam entry, displays the response wait and provides Open Steam during startup and from the session menu. It reveals the existing real session and releases the library cover/menu/keyboard/input ownership without waiting for CEF, answering the prompt, stealing Windows focus or launching CS2 directly. Actual prompt visibility/usability still requires the iPhone check.

          Export Run adds bounded typed launch transitions, request/action identity, stage begin/observation ages, optional CEF status, passive window generation/owner/visibility/GDI-presentation metadata and explicit view handoffs. Swapchain existence is separate from actual presentation. The observer has a global 24 UI-query allowance with eight reserved for relevant waits; its existing timeout/lifetime and privacy protections remain.

          Source freshness records app-start file identity/byte boundaries, current observations, truncation/rotation, unavailable sources and original selected timestamp ranges. Raw appends after the structured cutoff are labeled. The 03:xx historical CS2 console cannot populate the current 09:xx session. No observed CS2 process means gameplay metrics unavailable, not zero FPS/errors. Frame gaps require a live CS2 identity.

          Input snapshots retain sampler activity and cached controller state separately from physical changes, bindings, translation and Wine route/injection, with last-known ages. Source activity is not a game-action acknowledgment. The Run20 bounded queue/coalescing/ordering/overflow-neutralization, lifecycle/focus protection and first/recent failed-resource retention are preserved. The same Export Run button and one-ZIP share include separately identified preceding evidence after relaunch.

          Normal fixtures pass the exact public ShowInterstitials/old ActionID replay, source generations/rotation/truncation/cutoff, input ages, serialization/privacy, actual ZIP/cancellation/share behavior, durable resource failures, input ordering/lifecycle/custom bindings, GPU-completion/credit and reserve contracts. CI also checks the real iPhone SDK/Objective-C bridge, native/Metal/PE packaging, linked markers and source/components. No deliberate fault/crash/protected-memory/page-revocation experiment or captured instruction execution is used. Device overhead is unmeasured.

          Important limits: the primary kernel-heavy Run20 gameplay stall remains unresolved. Existing post-resume writable external mappings and whole-host I/O counters do not identify its expensive kernel operation. The destination-only texture shortage also remains: a 1-MiB destination cannot fit an 869912-byte usable window before staging. No sufficiently large safe reclamation was established; the memory reserve is preserved. These launch/export corrections are not a repaired-gameplay claim. Controller movement/aim/buttons, visual corruption, comparable remote frame pacing and sustained play through a round remain unverified on the iPhone.

          Preserved: bundle com.willfaust.madeora, installation/prefix/game/account/configuration, Steam session, JIT entitlement setup, 1152-MiB pool with 768/384 partition, code-buffer reuse, recovery/QoS, STLR/TSO/half-barrier, memory safeguards and GPU lifetimes. No unrelated graphics/network timeout/backing/JIT policy changes. Install over the existing app through the established signing workflow; do not uninstall or delete data.

          Details: https://github.com/letsdothisagainx/Madeira/blob/8a360afef38b82a3b84a1eaca73826d583b0d52e/docs/cs2-run21-steam-response-and-source-freshness.md
          Normal workflow: Run CS2, encounter the problem, tap Export Run, share one ZIP. Download Madeira.ipa below; SHA256SUMS verifies it.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title 'Madeira 8a360afe - Run21 Steam response and fresh evidence candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title 'Madeira 8a360afe - Run21 Steam response and fresh evidence candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt" --draft --prerelease
          fi
          gh release upload "$RELEASE_TAG" release-output/Madeira.ipa release-output/SHA256SUMS release-output/recovery-package.json release-output/run-evidence-package.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Verify the public download without authentication
        run: |
          public_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Madeira.ipa"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "$public_url" --output "$RUNNER_TEMP/public-Madeira.ipa"
          cmp release-output/Madeira.ipa "$RUNNER_TEMP/public-Madeira.ipa"
          printf 'Verified public IPA: %s\n' "$public_url"
          printf '## Stable IPA download\n\n[%s](%s)\n\nSource: `%s`\n\n' Madeira.ipa "$public_url" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          cat release-output/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
