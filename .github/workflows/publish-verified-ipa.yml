name: Publish verified IPA download

on:
  push:
    branches: [codex/cs2-live-memory-upload-reuse-20261116]
    paths: [.github/workflows/publish-verified-ipa.yml]
  workflow_dispatch:

# Delivery only: publish the exact successful candidate, never rebuild it or
# change the app revision. Keep write permission out of the compiler workflows.
permissions:
  actions: read
  contents: write

concurrency:
  group: publish-ipa-6367a156
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: 6367a1566aad52eb5ec23af973b93db402cd3885
      SOURCE_RUN: '45307261599'
      SOURCE_UUID: EA48680B-97E9-3102-A69D-CF790363851B
      RELEASE_TAG: ipa-6367a156
    steps:
      - name: Require the exact successful build and artifact
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + path]))
          run = api('/actions/runs/' + os.environ['SOURCE_RUN'])
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_REVISION']
          assert run['head_repository']['full_name'].lower() == repo.lower()
          assert run['path'] == '.github/workflows/build.yml'
          artifacts = api('/actions/runs/' + os.environ['SOURCE_RUN'] + '/artifacts?name=Madeira-ipa')['artifacts']
          assert len(artifacts) == 1
          artifact = artifacts[0]
          assert artifact['name'] == 'Madeira-ipa' and not artifact['expired']
          assert str(artifact['workflow_run']['id']) == os.environ['SOURCE_RUN']
          assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_REVISION']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', artifact['digest'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SOURCE_ARTIFACT=' + str(artifact['id']) + '\n')
              env.write('ARCHIVE_SHA256=' + artifact['digest'].split(':', 1)[1] + '\n')
          tag = api('/git/ref/tags/' + os.environ['RELEASE_TAG'])
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == os.environ['SOURCE_REVISION']
          print('PASS exact successful build, source revision and immutable artifact identity')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 6367a1566aad52eb5ec23af973b93db402cd3885
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: delivery-tools
          persist-credentials: false
      - name: Download and verify the already built IPA
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$RUNNER_TEMP/Madeira-ipa.zip"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/Madeira-ipa.zip" | sha256sum --check --strict
          mkdir release-output
          unzip -q "$RUNNER_TEMP/Madeira-ipa.zip" -d release-output
          test -s release-output/Madeira.ipa
          python3 tools/build/native-provenance.py check --root "$GITHUB_WORKSPACE" --revision "$SOURCE_REVISION" --ipa release-output/Madeira.ipa
          python3 delivery-tools/tests/host/check-store-recovery-package-inspector.py
          python3 delivery-tools/tools/check-store-recovery-package.py --ipa release-output/Madeira.ipa --revision "$SOURCE_REVISION" --require-pressure-boundary --require-recovery-scope --require-cs2-tso-profile > release-output/recovery-package.json
          cat release-output/recovery-package.json
          python3 - <<'PY'
          import json, os
          package = json.load(open('release-output/recovery-package.json'))
          assert package['bundleIdentifier'] == 'com.willfaust.madeora', 'installation identity changed'
          assert package['pressureBoundaryRequired'] is True
          assert package['recoveryScopeRequired'] is True
          assert package['cs2TSOProfileRequired'] is True
          assert package['nativeUUID'] == os.environ['SOURCE_UUID']
          print('PASS existing installation identity and compiled scoped recovery/pressure producers')
          PY
          python3 delivery-tools/tools/check-run-evidence-package.py --ipa release-output/Madeira.ipa > release-output/run-evidence-package.json
          (cd release-output && sha256sum Madeira.ipa > SHA256SUMS)
      - name: Publish the same IPA as a stable prerelease asset
        run: |
          cat > "$RUNNER_TEMP/ipa-release-notes.txt" <<'NOTES'
          Installable Madeira candidate addressing Run18 external-backing retirement and export gaps.

          App source: 6367a1566aad52eb5ec23af973b93db402cd3885
          Native UUID: EA48680B-97E9-3102-A69D-CF790363851B
          IPA SHA256: 9f9c98cb513f14c119b2952e44f5651805a312455f0cda88b2145a41f6c3fdcc
          IPA build: https://github.com/letsdothisagainx/Madeira/actions/runs/45307261599
          Focused normal Linux/macOS/iPhone SDK checks: https://github.com/letsdothisagainx/Madeira/actions/runs/45307257943

          Run18 was a failed remote Mirage session. Reproduced current-run records remove 1121 incident duplicates and select 54 main intervals wholly inside activation-to-explicit-timeout using native capture timestamps and measured clock calibration. They contain 2.854868 seconds user CPU and 30.366529 seconds kernel CPU, 91.4065% of consumed CPU. The STLR fallback actually ran. Most sampled stores observe RW external-pager backing after resume; this is not a kernel stack or an atomic observation.

          Published XNU clears KILLPAGES dirty state only for internal objects. Madeira incorrectly treated it as dirty-page disposal for its shared external backing and gated fresh decommit on its success. This candidate removes those external retirement scans/deactivation calls and the unsupported gate. Fresh zero offsets and successful hole punching still control zero-on-reuse; retired offsets remain quarantined, contents-preserving copyback and guest/host protection contracts remain intact. No live allocation is migrated or force-freed. This corrects an established release/decommit assumption; induced pager pressure is plausible, but its role in the dominant live-store stall and actual gameplay improvement remain unproven.

          Export Run now records bounded exact-host-page Mach metadata separately from region metadata, including the second page for crossing accesses, result/timestamps and generation consistency. Punch records include synchronous fallback, file-open and retired-extent identities, deferred/synchronous and lock scope, plus separate per-operation aggregates. All observation stays after existing target resume, with no guest payload reads, warming, extra suspension or protection changes.

          Stable config/module/error summaries are coalesced, automatic checkpoints run every five ticks, and only dirty journals need fsync. Recorder logical writes, checkpoint/flush/fsync, rotation and incident-copy work are separate from host-app IO. A normal host fixture measured 200 metadata writes for 100 unchanged checkpoints; the baseline method wrote 500. This is not an iPhone performance benchmark. Actual recorder physical/CPU overhead on iPhone remains unmeasured.

          Loopback activation remains within its connection attempt. Original explicit close reasons and repeated reports stay separate from cleanup. CPU summaries use wholly contained capture intervals and calibrated original console boundaries with boundary/background exclusions. Typed graphics failures cover allocation, invalid arguments, missing resources/materials and shader/pipeline messages without broad text disclosure. Crash-report file identity/time and live-versus-prior-session capture status preserve uncertainty. Only actually delivered system diagnostics are included, with honest build/time matching.

          Normal metadata fixtures cover the actual baseline/corrected retirement functions, split extents, quarantine/reuse, synchronous fallback, ordinary Mach page queries, per-operation counters, serialization, clock/attempt boundaries, redaction, rotation, incomplete recordings and the existing streaming ZIP/share/cancellation path. Actual iPhone SDK/native/app builds and final package checks pass. No deliberate crash, protected-memory, page-revocation, forced-fault or execution of captured instruction bytes is used.

          The full 1152-MiB JIT pool and 768/384 partition, TSO/STLR settings, prior recovery/QoS correction, physical reserve, GPU lifetimes, backing cap, Steam/network settings, input, bundle identity, prefix, installation, account and user configuration are preserved. No global backing disable, MAP_PRIVATE replacement, anonymous-gigabyte migration or graphics-setting change is made. Install over the existing app using the established signing workflow; do not uninstall or delete data.

          Publication verifies exact successful build/source, immutable artifact bytes, actual native UUID/components, linked page-query/recorder/retirement policy, bundle identity and recovery/pressure/TSO producers. Matching symbols: Madeira-native-symbols:45307261599. The public unauthenticated download is compared byte for byte with the built IPA.

          Device acceptance remains unverified: use the same remote Mirage sequence, responsive team selection, sustained gameplay through a round, continuing main/render progress without timeout, intact textures and a clean return/changelevel. A build, menu FPS or a richer ZIP is not gameplay acceptance. An empty graphics error file does not certify textures.

          Details: https://github.com/letsdothisagainx/Madeira/blob/6367a1566aad52eb5ec23af973b93db402cd3885/docs/cs2-run18-external-backing-retirement.md
          Normal workflow: Run CS2, encounter the problem, tap Export Run, share one ZIP. After app closure/relaunch, the available prior run remains separately identified. Download Madeira.ipa below; SHA256SUMS verifies it.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title 'Madeira 6367a156 - Run18 external backing retirement candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title 'Madeira 6367a156 - Run18 external backing retirement candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt" --draft --prerelease
          fi
          gh release upload "$RELEASE_TAG" release-output/Madeira.ipa release-output/SHA256SUMS release-output/recovery-package.json release-output/run-evidence-package.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Verify the public download without authentication
        run: |
          public_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Madeira.ipa"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "$public_url" --output "$RUNNER_TEMP/public-Madeira.ipa"
          cmp release-output/Madeira.ipa "$RUNNER_TEMP/public-Madeira.ipa"
          printf 'Verified public IPA: %s\n' "$public_url"
          printf '## Stable IPA download\n\n[%s](%s)\n\nSource: `%s`\n\n' Madeira.ipa "$public_url" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          cat release-output/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
