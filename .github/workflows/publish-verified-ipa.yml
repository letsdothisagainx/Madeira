name: Publish verified IPA download

on:
  push:
    branches: [codex/cs2-live-memory-upload-reuse-20261116]
    paths: [.github/workflows/publish-verified-ipa.yml]
  workflow_dispatch:

# Delivery only: publish the exact successful candidate, never rebuild it or
# change the app revision. Keep write permission out of the compiler workflows.
permissions:
  actions: read
  contents: write

concurrency:
  group: publish-ipa-48a4fef1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: 48a4fef1f1a82a508597ce033d6ad740f1847f8b
      SOURCE_RUN: '44680005845'
      SOURCE_ARTIFACT: '14605278975'
      ARCHIVE_SHA256: c4941755ad9469fdc2098c48f1092df371ea3655890866c5a0eafe1548abc793
      RELEASE_TAG: ipa-48a4fef1
    steps:
      - name: Require the exact successful build and artifact
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + path]))
          run = api('/actions/runs/' + os.environ['SOURCE_RUN'])
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_REVISION']
          assert run['head_repository']['full_name'].lower() == repo.lower()
          assert run['path'] == '.github/workflows/build.yml'
          artifact = api('/actions/artifacts/' + os.environ['SOURCE_ARTIFACT'])
          assert artifact['name'] == 'Madeira-ipa' and not artifact['expired']
          assert str(artifact['workflow_run']['id']) == os.environ['SOURCE_RUN']
          assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_REVISION']
          assert artifact['digest'] == 'sha256:' + os.environ['ARCHIVE_SHA256']
          tag = api('/git/ref/tags/' + os.environ['RELEASE_TAG'])
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == os.environ['SOURCE_REVISION']
          print('PASS exact successful build, source revision and immutable artifact identity')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 48a4fef1f1a82a508597ce033d6ad740f1847f8b
          persist-credentials: false
      - name: Download and verify the already built IPA
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$RUNNER_TEMP/Madeira-ipa.zip"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/Madeira-ipa.zip" | sha256sum --check --strict
          mkdir release-output
          unzip -q "$RUNNER_TEMP/Madeira-ipa.zip" -d release-output
          test -s release-output/Madeira.ipa
          python3 tools/build/native-provenance.py check --root "$GITHUB_WORKSPACE" --revision "$SOURCE_REVISION" --ipa release-output/Madeira.ipa
          (cd release-output && sha256sum Madeira.ipa > SHA256SUMS)
      - name: Publish the same IPA as a stable prerelease asset
        run: |
          cat > "$RUNNER_TEMP/ipa-release-notes.txt" <<'NOTES'
          Verified Madeira IPA from source 48a4fef1f1a82a508597ce033d6ad740f1847f8b.

          The complete IPA workflow passed at https://github.com/letsdothisagainx/Madeira/actions/runs/44680005845.
          This release publishes that exact artifact without recompilation or modification.

          The production correction covers a missed CPU command-data cache. Previously completed normal blocks could retain their loading high-water mark for 300 later submissions or maintenance calls. Pressure maintenance now retains at most one bounded completed block at the serialized producer's existing safe point; pending data remains owned until real GPU completion and command reset. Dedicated writable VM backing returns completed pages instead of leaving freed capacity retained in the general allocator. It does not change live textures, guest memory, executable JIT pages, or the texture-admission reserve.

          All 272 required host checks passed. Focused Linux/macOS ownership, failure, page geometry, race and completion tests passed at https://github.com/letsdothisagainx/Madeira/actions/runs/44680001282. An identical 55,578,624-byte native command workload measured a footprint drop from 51,463,360 to 4,260,992 bytes after maintenance; malloc variants showed no drop. Initial burst capacity was unchanged. This is a controlled host result, not a measured iPhone loading speedup.

          The attached Run12 contains worker-driven main-thread context captures followed by continuing execution, rather than the older quoted self-suspension. SuspendThread/ResumeThread behavior is unchanged.

          Native image UUID: ADAB4FE6-A5F5-3B52-8F07-4682B764F17F.
          Detailed evidence, changes and validation limits: https://github.com/letsdothisagainx/Madeira/blob/${{ github.sha }}/docs/cs2-run12-cpu-command-pressure-20261120.md

          Existing installation, bundle identity, configuration, Steam authentication, networking, 1152 MiB JIT pool, renderer, upload bounds and dynamic-buffer reuse are preserved. No game files or proprietary binaries are modified.

          Responsive remote team selection, gameplay through a round, lower loading times, complete texture success and safe iPhone headroom remain unverified. The current full working-set owner distribution was not established by the exported capacity counters. This release fixes a source-confirmed reclamation defect without claiming that every Run12 failure is solved.

          Download Madeira.ipa from the assets below. SHA256SUMS records its checksum.
          NOTES
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title 'Madeira 48a4fef1 - completed CPU command memory' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt" --draft --prerelease
          gh release upload "$RELEASE_TAG" release-output/Madeira.ipa release-output/SHA256SUMS --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Verify the public download without authentication
        run: |
          public_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Madeira.ipa"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "$public_url" --output "$RUNNER_TEMP/public-Madeira.ipa"
          cmp release-output/Madeira.ipa "$RUNNER_TEMP/public-Madeira.ipa"
          printf 'Verified public IPA: %s\n' "$public_url"
          printf '## Stable IPA download\n\n[%s](%s)\n\nSource: `%s`\n\n' Madeira.ipa "$public_url" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          cat release-output/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
