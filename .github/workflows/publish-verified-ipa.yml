name: Publish verified IPA download

on:
  push:
    branches: [codex/cs2-live-memory-upload-reuse-20261116]
    paths: [.github/workflows/publish-verified-ipa.yml]
  workflow_dispatch:

# Delivery only: publish the exact successful candidate, never rebuild it or
# change the app revision. Keep write permission out of the compiler workflows.
permissions:
  actions: read
  contents: write

concurrency:
  group: publish-ipa-9ba172ee
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: 9ba172ee9ff3d093b0681ea3867ffcb237e0b55e
      SOURCE_RUN: '45077310645'
      RELEASE_TAG: ipa-9ba172ee
    steps:
      - name: Require the exact successful build and artifact
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + path]))
          run = api('/actions/runs/' + os.environ['SOURCE_RUN'])
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_REVISION']
          assert run['head_repository']['full_name'].lower() == repo.lower()
          assert run['path'] == '.github/workflows/build.yml'
          artifacts = api('/actions/runs/' + os.environ['SOURCE_RUN'] + '/artifacts?name=Madeira-ipa')['artifacts']
          assert len(artifacts) == 1
          artifact = artifacts[0]
          assert artifact['name'] == 'Madeira-ipa' and not artifact['expired']
          assert str(artifact['workflow_run']['id']) == os.environ['SOURCE_RUN']
          assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_REVISION']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', artifact['digest'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SOURCE_ARTIFACT=' + str(artifact['id']) + '\n')
              env.write('ARCHIVE_SHA256=' + artifact['digest'].split(':', 1)[1] + '\n')
          tag = api('/git/ref/tags/' + os.environ['RELEASE_TAG'])
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == os.environ['SOURCE_REVISION']
          print('PASS exact successful build, source revision and immutable artifact identity')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 9ba172ee9ff3d093b0681ea3867ffcb237e0b55e
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: delivery-tools
          persist-credentials: false
      - name: Download and verify the already built IPA
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$RUNNER_TEMP/Madeira-ipa.zip"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/Madeira-ipa.zip" | sha256sum --check --strict
          mkdir release-output
          unzip -q "$RUNNER_TEMP/Madeira-ipa.zip" -d release-output
          test -s release-output/Madeira.ipa
          python3 tools/build/native-provenance.py check --root "$GITHUB_WORKSPACE" --revision "$SOURCE_REVISION" --ipa release-output/Madeira.ipa
          python3 delivery-tools/tests/host/check-store-recovery-package-inspector.py
          python3 delivery-tools/tools/check-store-recovery-package.py --ipa release-output/Madeira.ipa --revision "$SOURCE_REVISION" --require-pressure-boundary > release-output/recovery-package.json
          cat release-output/recovery-package.json
          (cd release-output && sha256sum Madeira.ipa > SHA256SUMS)
      - name: Publish the same IPA as a stable prerelease asset
        run: |
          cat > "$RUNNER_TEMP/ipa-release-notes.txt" <<'NOTES'
          Installable Madeira candidate from source 9ba172ee9ff3d093b0681ea3867ffcb237e0b55e.

          IPA build: https://github.com/letsdothisagainx/Madeira/actions/runs/45077310645
          Focused Linux/macOS checks: https://github.com/letsdothisagainx/Madeira/actions/runs/44885207359

          This packages the existing Run14 pressure-boundary changes for installation on iPhone. It is not a demonstrated texture-memory or playable-multiplayer fix. The remaining reclaimable memory owner and the loading/renderer failure still require attribution; no on-device pass or memory saving is claimed.

          The first physical-budget refusal queues one bounded ownership observation per process lease (four maximum per host session). The existing worker records selected non-pool VM regions and their recorded FEX/CEF/window ownership and generation metadata. Unknown/stale ownership remains explicit and never permits reclamation. The native request occurs after releasing the creation-receipt mutex. No texture success is fabricated, and no live or quarantined storage is forcibly freed.

          Normal-input checks reproduce all eight recorded admission decisions against the actual native predicate, exercise 400 parallel receipt acquisitions/releases and 80,000 coalesced observation requests, preserve privacy filtering, and retain the existing checked-store discovery tests. The build selects the recovery-normal profile; no deliberate crash, protected-memory, page-revocation or fault-injection experiment is requested. The full historical host suite is not claimed.

          The full 1,152 MiB JIT pool and 768/384 MiB partition, code-buffer reuse, checked-store recovery, physical safety reserve, GPU completion/resource lifetimes, Steam authentication, networking and existing input behavior are preserved. The existing bundle identifier, Wine prefix, game files, Steam setup and user configuration are retained. Install over the existing app with the same signing identity; do not uninstall or delete its data.

          The artifact's source revision, native provenance and immutable archive digest are checked before publication. recovery-package.json verifies the compiled recovery path, Run14 native producer markers, and the defined pressure callback. Publication copies the built IPA without rebuilding it, then compares an unauthenticated public download byte for byte.

          Device acceptance remains responsive remote team selection, sustained gameplay through a round and a clean menu/map transition without failed required textures. Build and host checks do not establish those outcomes.

          Detailed analysis: https://github.com/letsdothisagainx/Madeira/blob/9ba172ee9ff3d093b0681ea3867ffcb237e0b55e/docs/cs2-run14-pressure-attribution-20261121.md

          Download Madeira.ipa below. SHA256SUMS verifies its bytes.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title 'Madeira 9ba172ee - Run14 installable candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title 'Madeira 9ba172ee - Run14 installable candidate' --notes-file "$RUNNER_TEMP/ipa-release-notes.txt" --draft --prerelease
          fi
          gh release upload "$RELEASE_TAG" release-output/Madeira.ipa release-output/SHA256SUMS release-output/recovery-package.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Verify the public download without authentication
        run: |
          public_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Madeira.ipa"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "$public_url" --output "$RUNNER_TEMP/public-Madeira.ipa"
          cmp release-output/Madeira.ipa "$RUNNER_TEMP/public-Madeira.ipa"
          printf 'Verified public IPA: %s\n' "$public_url"
          printf '## Stable IPA download\n\n[%s](%s)\n\nSource: `%s`\n\n' Madeira.ipa "$public_url" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          cat release-output/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
