name: Verify cross-page vector store execution

on:
  workflow_dispatch:
    inputs:
      allow_legacy_fault_cases:
        description: Historical captured-code/fault experiments; requires separate explicit authorization
        type: boolean
        default: false
  push:
    paths:
      - 'build/ntdll-unix/server_ios.c'
      - 'build/ntdll-unix/signal_arm64_ios.c'
      - 'build/ntdll-unix/stuck_store_history.h'
      - 'tests/host/check-cross-page-vector-store.py'
      - 'tests/host/check-sparse-cross-page-store.py'
      - 'tests/host/check-cross-page-store-recovery.py'
      - 'tests/host/fixtures/ios-crossing-store-before-checked-write.c'
      - 'tests/host/check-stuck-store-history.py'
      - 'tests/host/check-stuck-store-scheduling.py'
      - '.github/workflows/cross-page-store.yml'

permissions:
  contents: read

jobs:
  native-store:
    # Foreground normal-input sessions must never trigger these via a push.
    if: github.event_name == 'workflow_dispatch' && inputs.allow_legacy_fault_cases
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute captured ARM64 stores on anonymous and shared file mappings
        env:
          CC: clang
        run: python3 tests/host/check-cross-page-vector-store.py --require-arm64
      - name: Verify checked Mach writes, concurrent revocation and genuine store completion
        env:
          CC: clang
        run: python3 tests/host/check-cross-page-store-recovery.py --require-darwin --sanitize
      - name: Execute first writes across sparse and mixed-object boundaries
        env:
          CC: clang
        run: python3 tests/host/check-sparse-cross-page-store.py --require-arm64
      - name: Verify recovery coverage across the complete native thread snapshot
        env:
          CC: clang
        run: python3 tests/host/check-stuck-store-history.py --sanitize
      - name: Verify production recovery scheduling and native ownership
        env:
          CC: clang
        run: python3 tests/host/check-stuck-store-scheduling.py --sanitize
