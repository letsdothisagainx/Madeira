name: Inspect matching CS2 loading instructions
on:
  workflow_dispatch:
  push:
    branches: [codex/cs2-live-memory-upload-reuse-20261116]
    paths:
      - tools/inspect-cs2-loading.py
      - .github/workflows/cs2-loading-inspect.yml
permissions:
  contents: read
jobs:
  normal-snapshots:
    strategy:
      matrix:
        runner: [ubuntu-24.04, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check exact-thread bounds without fault experiments
        run: python3 tests/host/check-cs2-stall-watch.py ${{ runner.os == 'macOS' && '--require-swift' || '' }}
      - name: Compile existing touched fixtures without executing fault scenarios
        run: |
          python3 tests/host/check-cs2-observation.py --compile-only
          python3 tests/host/check-stuck-store-scheduling.py --compile-only
      - name: Replay successful copy progress during ordinary discovery work
        run: python3 tests/host/check-stuck-store-scheduling.py --discovery-normal-only
  official-images:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read matching official images without execution or fault tests
        run: |
          python3 -m venv "$RUNNER_TEMP/cs2-inspect-env"
          "$RUNNER_TEMP/cs2-inspect-env/bin/pip" install pefile capstone xxhash
          "$RUNNER_TEMP/cs2-inspect-env/bin/python" tools/inspect-cs2-loading.py --scratch "$RUNNER_TEMP/cs2-loading-images"
