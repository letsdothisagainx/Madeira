name: Validate CS2 content integrity on Apple
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content-integrity:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Configure system decoder libraries
        run: |
          brew list xz >/dev/null 2>&1 || brew install xz
          echo "CPATH=$(brew --prefix xz)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix xz)/lib" >> "$GITHUB_ENV"
      - name: Reproduce both real baseline integrity failures
        run: |
          set +e
          MADEIRA_STEAM_INTEGRITY_BASELINE=4b41f1dd7603612e1596ac885d0b883fa601cf26 python3 tests/host/check-steam-library.py > content-baseline.txt 2>&1
          result=$?
          tail -100 content-baseline.txt
          test "$result" -ne 0 || exit 1
          python3 - <<'PYCODE'
          from pathlib import Path
          text=Path('content-baseline.txt').read_text()
          expected=["FAIL: resuming rehashes journal candidates: only the changed completed chunk is fetched again", "FAIL: a different SHA-1 fails the authentic downloader without publishing an installed record", "FAIL: rejected chunk bytes never reach the game file, even when size and Adler match"]
          assert all(line in text for line in expected), 'baseline must fail on both real producer defects, not compiler/setup errors'
          assert 'PASS: the production Steam library, download and decoder code compile on the host' in text
          print('PASS: exact old production code reproduces journal trust and SHA1 omission')
          PYCODE
      - name: Validate production corrections and bounded read-only audit
        run: |
          set -o pipefail
          python3 tests/host/check-steam-library.py | tee content-fixed.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cs2-content-integrity
          path: content-*.txt
          retention-days: 14
