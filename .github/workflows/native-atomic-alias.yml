name: Early CS2 native SRW writer hardware validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-srw:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load exact pinned Wine producer
        run: git submodule update --init --depth 1 wine
      - name: Verify production native contracts, staging and lifetime boundaries
        run: |
          python3 tests/host/check-native-counter-stage.py
          python3 tests/host/check-native-counter-alias.py
          python3 tests/host/check-native-srw-alias.py
          python3 tests/host/check-native-srw-history.py
      - name: Measure original Mach faults and source-built RW history writer
        run: |
          set -o pipefail
          python3 tests/host/check-native-srw-history-performance.py --require-arm64-darwin | tee native-srw-throughput.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-srw-throughput
          path: native-srw-throughput.txt
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-srw-assembly
          path: ${{ runner.temp }}/madeira-srw-history-diagnostics/srw-history.s
          if-no-files-found: ignore
          retention-days: 14
