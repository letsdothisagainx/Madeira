name: Early real FEX native diagnostic writer validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-fex-native-diagnostics:
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load exact pinned FEX and Wine sources
        run: |
          git submodule update --init --depth 1 FEX wine
          git -C FEX submodule update --init --depth 1 External/fmt External/rpmalloc
      - name: Prove production diagnostic contracts and failing-before estimator
        run: |
          set -o pipefail
          python3 tests/host/check-fex-native-diagnostics-alias.py | tee fex-native-contract.txt
          python3 tests/host/check-fex-native-diagnostics-package.py | tee fex-native-package.txt
          python3 tests/host/check-fex-subfloor-package.py
          python3 tests/host/check-fex-cb-summary.py | tee fex-cb-summary.txt
          python3 tests/host/check-scm-rpc-sync.py
      - name: Preserve existing SRW and alias atomics
        run: |
          python3 tests/host/check-native-counter-alias.py
          python3 tests/host/check-native-counter-stage.py
          python3 tests/host/check-native-srw-alias.py
          python3 tests/host/check-native-srw-history.py
          python3 tests/host/check-jit-alias-exclusive.py
          python3 tests/host/check-jit-alias-exclusive-add.py
          python3 tests/host/check-jit-alias-exclusive-conditional.py
          python3 tests/host/check-jit-alias-exclusive-compare.py
          python3 tests/host/check-jit-alias-str-immediate.py
      - name: Execute captured FEX telemetry and actual IR producer through real Mach faults
        run: |
          set -o pipefail
          python3 tests/host/check-fex-native-diagnostics-performance.py --require-arm64-darwin | tee fex-native-throughput.txt
      - name: Retest source-built SRW producer hardware
        if: always()
        run: |
          set -o pipefail
          python3 tests/host/check-native-srw-history-performance.py --require-arm64-darwin | tee native-srw-throughput.txt
      - name: Verify pinned inputs remain untouched
        if: always()
        run: |
          git -C FEX diff --exit-code
          git -C wine diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fex-native-diagnostics-evidence
          path: |
            fex-native-contract.txt
            fex-native-package.txt
            fex-cb-summary.txt
            fex-native-throughput.txt
            native-srw-throughput.txt
          if-no-files-found: ignore
          retention-days: 14
