name: Early CS2 Metal and app-clock compile validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-metal-clock:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load exact pinned Wine and DXMT sources
        run: git submodule update --init --depth 1 wine dxmt
      - name: Compile actual staged Metal producer and native diagnostic controls
        run: python3 tests/host/check-metal-diagnostics.py
      - name: Compile and execute production Swift startup clock
        run: python3 tests/host/check-steam-startup-app-clock.py --require-swift
