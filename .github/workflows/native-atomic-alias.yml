name: Validate read-only CS2 diagnostic export
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-export:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute actual production parser, reader and ZIP with Swift and ASan
        run: |
          set -o pipefail
          python3 tests/host/check-steam-game-diagnostics.py --require-swift | tee export-proof.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: steam-cs2-export-proof
          path: export-proof.txt
          retention-days: 14
