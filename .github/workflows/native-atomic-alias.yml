name: Verify native atomic alias execution
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/pr-build-*', codex/validate-cs2-integrity-runtime-4b41]
    paths:
      - build/ntdll-unix/native_atomic*.h
      - build/ntdll-unix/native_data_alias.h
      - build/ntdll-unix/native_srw_alias.h
      - build/ntdll-unix/native_fex_diagnostics_alias.h
      - build/fex-compat/native-diagnostics.patch
      - build/fex-compat/owner_allocator*
      - tests/host/check-fex-owner-backoff*.py
      - build/fex-compat/native-tracker-storage.patch
      - tools/build/stage-fastsync-timeout.py
      - tests/host/check-fastsync-timeout.py
      - tests/host/fastsync-timeout-test.c
      - build/fex-compat/transition-writer.patch
      - build/fex-compat/wow-syscall-writer.patch
      - build/fex-compat/shufps-broadcast.patch
      - tests/host/check-fex-shufps-broadcast.py
      - tests/fixtures/fex-shufps/**
      - tools/build/stage-native-lfh-size.py
      - tools/check-native-lfh-size-code.py
      - tests/host/*native*lfh*size*
      - tests/host/*fex*transition*writer*
      - tests/host/*fex*syscall*writer*
      - tests/host/check-fex-invalidation-storage.py
      - build/fex-compat/native_diagnostics.h
      - tests/host/*fex*native*diagnostics*
      - tests/host/*native*srw*
      - build/ntdll-unix/native_counter*.h
      - build/wine-pe/build-ntdll.sh
      - tools/build/stage-native-counter-writes.py
      - tools/build/stage-native-srw-wake.py
      - tests/host/*native*counter*
      - tests/host/*native*direct*call*
      - build/ntdll-unix/signal_arm64_ios.c
      - build/ntdll-unix/jit_store_census.h
      - tests/host/check-native-atomic*.py
      - tests/host/check-native-data*.py
      - tests/host/check-jit-alias-exclusive-conditional*.py
      - tests/host/check-jit-alias-exclusive-compare.py
      - tests/host/jit_alias_exclusive_conditional*.c
      - tests/host/jit_alias_exclusive_compare_test.c
      - tests/host/native*atomic*.c
      - tests/host/native*data*alias*.c
      - tests/host/check-jit-store-census.py
      - .github/workflows/native-atomic-alias.yml
  pull_request:
    paths:
      - build/ntdll-unix/native_atomic*.h
      - build/ntdll-unix/native_data_alias.h
      - build/ntdll-unix/native_srw_alias.h
      - build/ntdll-unix/native_fex_diagnostics_alias.h
      - build/fex-compat/native-diagnostics.patch
      - build/fex-compat/owner_allocator*
      - tests/host/check-fex-owner-backoff*.py
      - build/fex-compat/native-tracker-storage.patch
      - tools/build/stage-fastsync-timeout.py
      - tests/host/check-fastsync-timeout.py
      - tests/host/fastsync-timeout-test.c
      - build/fex-compat/transition-writer.patch
      - build/fex-compat/wow-syscall-writer.patch
      - build/fex-compat/shufps-broadcast.patch
      - tests/host/check-fex-shufps-broadcast.py
      - tests/fixtures/fex-shufps/**
      - tools/build/stage-native-lfh-size.py
      - tools/check-native-lfh-size-code.py
      - tests/host/*native*lfh*size*
      - tests/host/*fex*transition*writer*
      - tests/host/*fex*syscall*writer*
      - tests/host/check-fex-invalidation-storage.py
      - build/fex-compat/native_diagnostics.h
      - tests/host/*fex*native*diagnostics*
      - tests/host/*native*srw*
      - build/ntdll-unix/native_counter*.h
      - build/wine-pe/build-ntdll.sh
      - tools/build/stage-native-counter-writes.py
      - tools/build/stage-native-srw-wake.py
      - tests/host/*native*counter*
      - tests/host/*native*direct*call*
      - build/ntdll-unix/signal_arm64_ios.c
      - build/ntdll-unix/jit_store_census.h
      - tests/host/check-native-atomic*.py
      - tests/host/check-native-data*.py
      - tests/host/check-jit-alias-exclusive-conditional*.py
      - tests/host/check-jit-alias-exclusive-compare.py
      - tests/host/jit_alias_exclusive_conditional*.c
      - tests/host/jit_alias_exclusive_compare_test.c
      - tests/host/native*atomic*.c
      - tests/host/native*data*alias*.c
      - tests/host/check-jit-store-census.py
      - .github/workflows/native-atomic-alias.yml
permissions:
  contents: read
jobs:
  apple-arm64-execution:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load pinned Wine and FEX counter producer source
        run: |
          git submodule update --init --depth 1 wine FEX
          git -C FEX submodule update --init --depth 1 External/rpmalloc
      - name: Prove native address lowering and exact packaged image invariants
        run: |
          python3 tests/host/check-native-data-alias.py
          python3 tests/host/check-native-data-direct-call.py
          python3 tests/host/check-native-counter-alias.py
          python3 tests/host/check-native-counter-stage.py
          python3 tests/host/check-native-lfh-size.py
          python3 tests/host/check-native-lfh-size-code.py
          python3 tests/host/check-native-srw-alias.py
          python3 tests/host/check-native-srw-history.py
          python3 tests/host/check-native-srw-wake.py
          python3 tests/host/check-fastsync-timeout.py
          python3 tests/host/check-native-atomic-alias.py
          python3 tests/host/check-native-atomic-image.py
          python3 tests/host/check-jit-store-census.py
          python3 tests/host/check-jit-alias-exclusive-conditional.py
          python3 tests/host/check-jit-alias-exclusive-compare.py
          python3 tests/host/check-jit-alias-exclusive.py
          python3 tests/host/check-jit-alias-exclusive-add.py
          python3 tests/host/check-jit-alias-str-immediate.py
      - name: Measure real Mach faults, native throughput and atomic contention
        run: |
          set -o pipefail
          python3 tests/host/check-native-data-alias-performance.py --require-arm64-darwin | tee native-data-throughput.txt
          python3 tests/host/check-native-atomic-alias-performance.py --require-arm64-darwin | tee native-atomic-throughput.txt
      - name: Execute captured DXMT conditional exclusive sequence through Mach faults
        run: |
          set -o pipefail
          python3 tests/host/check-jit-alias-exclusive-conditional-hardware.py --require-arm64-darwin | tee conditional-exclusive-hardware.txt
      - name: Measure the captured SRW diagnostic writer with real Mach faults
        run: |
          set -o pipefail
          python3 tests/host/check-native-srw-history-performance.py --require-arm64-darwin | tee native-srw-throughput.txt
      - name: Measure captured FEX telemetry and IR counters with real Mach faults
        run: |
          set -o pipefail
          python3 tests/host/check-fex-native-history.py
          python3 tests/host/check-fex-invalidation-storage.py
          python3 tests/host/check-fex-native-diagnostics-performance.py --require-arm64-darwin | tee native-fex-diagnostics-throughput.txt
      - name: Verify real FEX transition probes and shared alias counters
        run: |
          set -o pipefail
          python3 tests/host/check-fex-wow-syscall-writer.py
          python3 tests/host/check-fex-transition-writer-performance.py --require-arm64-darwin | tee native-fex-transition-throughput.txt
      - name: Measure actual owner lock contention and verify recursion/readiness
        run: |
          set -o pipefail
          python3 tests/host/check-fex-owner-backoff.py | tee native-fex-owner-backoff.txt
      - name: Execute captured Phonon broadcast lowering on Apple ARM64
        run: |
          set -o pipefail
          python3 tests/host/check-fex-shufps-broadcast.py --require-arm64-darwin | tee native-fex-shufps.txt
      - name: Measure production QPC counter writer with real Mach faults
        if: always()
        run: |
          set -o pipefail
          python3 tests/host/check-native-qpc-counter-performance.py --require-arm64-darwin | tee native-qpc-throughput.txt
      - name: Measure captured FEX statistics counter with real exclusive retry
        if: always()
        run: |
          set -o pipefail
          python3 tests/host/check-native-counter-call-performance.py --require-arm64-darwin | tee native-counter-call-throughput.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-atomic-throughput
          path: |
            native-atomic-throughput.txt
            native-data-throughput.txt
            native-qpc-throughput.txt
            native-counter-call-throughput.txt
            conditional-exclusive-hardware.txt
            native-srw-throughput.txt
            native-fex-diagnostics-throughput.txt
            native-fex-transition-throughput.txt
            native-fex-shufps.txt
            native-fex-owner-backoff.txt
          if-no-files-found: ignore
          retention-days: 14
