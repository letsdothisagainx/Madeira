name: Verify native atomic alias execution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trust-arm64ec-object:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load pinned Wine source
        run: git submodule update --init --depth 1 wine
      - uses: actions/cache/restore@v4
        with:
          key: mingw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build/setup-llvm-mingw.sh') }}
          path: toolchains/llvm-mingw-*
      - name: Set up the actual pinned Wine compiler and native headers
        run: |
          bash tools/build/setup-llvm-mingw.sh
          brew list bison >/dev/null 2>&1 || brew install bison
          export PATH="$(brew --prefix bison)/bin:$PWD/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$PATH"
          mkdir -p wine/build-arm64ec
          cd wine/build-arm64ec
          ../configure --enable-archs=arm64ec --without-x --without-vulkan --without-freetype --without-gnutls --disable-tests
      - name: Reproduce original guard failure and verify actual corrected ARM64EC COFF
        run: |
          export PATH="$(brew --prefix bison)/bin:$PWD/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$PATH"
          python3 tests/host/check-trust-diagnostics-native-compile.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trust-arm64ec-object-before-after
          path: trust-native-objects
          if-no-files-found: error
          retention-days: 7
