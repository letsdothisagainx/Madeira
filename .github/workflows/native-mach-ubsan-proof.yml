name: Isolated native Mach sanitizer runtime comparison
on:
  push:
    branches: [codex/native-mach-ubsan-proof-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: xcode-27
    timeout-minutes: 12
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Compare real unchanged Mach fixture in both modes
        run: python3 tools/build/prove-native-mach-ubsan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-mach-ubsan-comparison
          path: native-mach-ubsan-results
          if-no-files-found: error
