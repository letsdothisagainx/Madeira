name: Validate VPK audit formats and native Security
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-vpk-audit:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Configure decoder libraries
        run: |
          brew list xz >/dev/null 2>&1 || brew install xz
          echo "CPATH=$(brew --prefix xz)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix xz)/lib" >> "$GITHUB_ENV"
      - name: Fetch exact public format reference without account credentials
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.error,json,base64,hashlib,os
          from pathlib import Path
          blob='5d31d10537994e41fb92dd655b73a0bfe4674e8b'
          url='https://api.github.com/repos/ValveResourceFormat/ValvePak/git/blobs/'+blob
          request=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'Madeira-format-regression'})
          try:
              with urllib.request.urlopen(request,timeout=30) as response: payload=json.load(response)
              raw=base64.b64decode(payload['content'])
          except urllib.error.HTTPError as error:
              if error.code not in (403,429): raise
              raw_url='https://raw.githubusercontent.com/ValveResourceFormat/ValvePak/037f25ef5ad3a4f1804d0715d16ee2bd78bd652a/ValvePak/ValvePak.Test/Files/cs2_new_signature_actually_signed.vpk'
              with urllib.request.urlopen(raw_url,timeout=30) as response: raw=response.read(10699)
              print('Public API rate-limited; exact pinned raw-file fallback will undergo identical blob/SHA256 verification')
          assert len(raw)==10698 and hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==blob
          assert hashlib.sha256(raw).hexdigest()=='8279de4e7c0a1d8b52d98b33efebac409ad13eb0b6ab8320b09e7d85b3a9d6b4'
          path=Path(os.environ['RUNNER_TEMP'])/'madeira-public-vpk-reference.vpk';path.write_bytes(raw)
          with Path(os.environ['GITHUB_ENV']).open('a') as out:out.write('MADEIRA_VPK_PUBLIC_FIXTURE='+str(path)+'\n')
          print('PASS pinned public Git blob and SHA256; no Valve-key authority inferred')
          PYCODE
      - name: Reproduce old production parser rejection with actual Swift
        run: |
          set +e
          MADEIRA_VPK_ONLY=1 MADEIRA_VPK_INTEGRITY_BASELINE=d573d42198994d6cfd8682b7751eb8cef9973258 python3 tests/host/check-steam-library.py > vpk-baseline.txt 2>&1
          result=$?
          tail -80 vpk-baseline.txt
          test "$result" -eq 1 || exit 1
          python3 - <<'PYCODE'
          from pathlib import Path
          text=Path('vpk-baseline.txt').read_text()
          assert 'PASS: the production Steam library, download and decoder code compile on the host' in text
          for case in ('modern-rsa','modern-unsigned','public-cs2-reference'):
              assert f'FAIL: VPK {case}: production parser recognizes supported layout or reports precise bounded failure' in text
          assert 'FAILURES:' in text and 'check-steam-library: 1 FAILED' in text
          assert 'ERROR: AddressSanitizer' not in text and 'AddressSanitizer:DEADLYSIGNAL' not in text
          print('PASS exact old parser rejects known owned and actual public descriptor fixtures at runtime')
          PYCODE
      - name: Execute fixed production parser checksum and real Apple Security regressions
        run: |
          set +e
          MADEIRA_VPK_ONLY=1 python3 tests/host/check-steam-library.py > vpk-fixed.txt 2>&1
          result=$?
          tail -100 vpk-fixed.txt
          test "$result" -eq 0 || exit "$result"
          python3 - <<'PYCODE'
          from pathlib import Path
          text=Path('vpk-fixed.txt').read_text()
          for case in ('modern-rsa','legacy-rsa','public-cs2-reference'):
              assert f'PASS: VPK {case}: native Security RSA mathematical result consistent-embedded-key' in text
          assert 'PASS: VPK signature-corrupt: native Security RSA mathematical result mismatch-embedded-key' in text
          assert 'PASS: VPK signature-only mutation is a genuine RSA mismatch even while all MD5 preimages match' in text
          assert 'check-steam-library: PASS (production VPK audit only)' in text
          print('PASS native Security is exercised; no unavailable-platform skip and no trust/VAC verdict')
          PYCODE
      - name: Bound owned-fixture logs
        if: always()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          for name in ('vpk-baseline.txt','vpk-fixed.txt'):
              path=Path(name)
              if path.exists() and path.stat().st_size>262144:
                  with path.open('rb') as stream:stream.seek(-262016,2);tail=stream.read(262016)
                  path.write_bytes(b'Earlier owned-fixture output omitted.\n'+tail)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vpk-format-native-security
          path: vpk-*.txt
          retention-days: 14
          if-no-files-found: ignore
