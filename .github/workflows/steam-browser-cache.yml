name: Verify Steam browser cache

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/pr-build-*']
    paths:
      - app/Madeira/SteamBrowserRuntime.swift
      - app/Madeira/SteamRuntime.swift
      - app/Madeira/SteamNativeBrowserLaunch.swift
      - tests/host/check-steam-browser-bridge.py
      - tests/host/check-steam-browser-logs.py
      - tests/host/htmlipc/test_log_file.c
      - build/ntdll-unix/htmlipc_log_file.h
      - tools/build/stage-htmlipc-log-file.py
      - tests/host/check-steam-browser-cache.py
      - tests/integration/check-official-steam-browser-cache.py
      - build/htmlipc/domain-routing/**
      - build/htmlipc/stream-codec/**
      - tests/host/check-htmlipc-domain-registry.py
      - tests/host/htmlipc/test_domain_registry.cpp
      - build/htmlipc/stream-install/**
      - build/htmlipc/runtime/runtime_provider.cpp
      - tests/host/check-htmlipc-controller.py
      - tests/host/htmlipc/test_controller_protection.cpp
      - .github/workflows/steam-browser-cache.yml
  pull_request:
    paths:
      - app/Madeira/SteamBrowserRuntime.swift
      - app/Madeira/SteamRuntime.swift
      - app/Madeira/SteamNativeBrowserLaunch.swift
      - tests/host/check-steam-browser-bridge.py
      - tests/host/check-steam-browser-logs.py
      - tests/host/htmlipc/test_log_file.c
      - build/ntdll-unix/htmlipc_log_file.h
      - tools/build/stage-htmlipc-log-file.py
      - tests/host/check-steam-browser-cache.py
      - tests/integration/check-official-steam-browser-cache.py
      - build/htmlipc/domain-routing/**
      - build/htmlipc/stream-codec/**
      - tests/host/check-htmlipc-domain-registry.py
      - tests/host/htmlipc/test_domain_registry.cpp
      - build/htmlipc/stream-install/**
      - build/htmlipc/runtime/runtime_provider.cpp
      - tests/host/check-htmlipc-controller.py
      - tests/host/htmlipc/test_controller_protection.cpp
      - .github/workflows/steam-browser-cache.yml

permissions:
  contents: read

jobs:
  browser-bridge:
    runs-on: xcode-27
    timeout-minutes: 5
    env:
      MADEIRA_VALVE_ARCHIVE_CACHE: ${{ github.workspace }}/.official-browser-archives
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.official-browser-archives
          key: official-browser-v2-fee14790-1ab3b383-8b712b2a
      - name: Test production Swift bridge upgrades, readback and interrupted ownership transactions
        run: python3 tests/host/check-steam-browser-bridge.py --require-swift --official-archives "$MADEIRA_VALVE_ARCHIVE_CACHE" --download-official
      - name: Load pinned Wine file syscall source
        run: git submodule update --init --depth 1 wine
      - name: Test native mutable logging and production Swift strict cache reuse
        run: python3 tests/host/check-steam-browser-logs.py --require-swift
  controller-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load pinned Wine file syscall source
        run: git submodule update --init --depth 1 wine
      - name: Test committed image ownership and exact writable data protections
        run: |
          python3 tests/host/check-htmlipc-controller.py
          python3 tests/host/check-htmlipc-domain-registry.py
          python3 tests/host/check-htmlipc-codecs.py
          python3 tests/host/check-steam-browser-logs.py
  browser-cache:
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      MADEIRA_VALVE_ARCHIVE_CACHE: ${{ github.workspace }}/.official-browser-archives
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test real Swift cache transactions and mixed architecture validation
        run: python3 tests/host/check-steam-browser-cache.py --require-swift
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.official-browser-archives
          key: official-browser-v2-fee14790-1ab3b383-8b712b2a
      - name: Verify complete official archives, downloader, commit and reuse
        run: python3 tests/integration/check-official-steam-browser-cache.py --download-official
